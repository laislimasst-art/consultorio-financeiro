      <header>${s.logo ? `<img class="r-logo" src="${esc(s.logo)}" alt="">` : ''}<div><h1>${esc(s.name)}</h1>
        <p>${esc(s.profession)}${s.crp ? ' · CRP ' + esc(s.crp) : ''}</p>
        ${s.cpf ? `<p>CPF/CNPJ: ${esc(s.cpf)}</p>` : ''}${s.address ? `<p>${esc(s.address)}</p>` : ''}
        ${s.phone || s.email ? `<p>${[s.phone, s.email].filter(Boolean).map(esc).join(' · ')}</p>` : ''}</div></header>
      <h2>RECIBO <span>${r.number ? 'Nº ' + esc(r.number) : 'Nº provisório'}</span></h2>
      <div class="r-val">${U.money(r.value)}</div>
      <p>Recebi de <strong>${esc(r.payerName)}</strong> a quantia de <strong>${U.money(r.value)}</strong>${U.extenso(r.value) ? ` (${esc(U.extenso(r.value))})` : ''}, referente a ${esc(r.description || 'serviços de psicologia')}.</p>
      <p>Data do pagamento: ${U.fmtDate(r.date)}</p>
      <div class="sign">${esc(s.name)}<br>${esc(s.profession)}${s.crp ? ' — CRP ' + esc(s.crp) : ''}</div>
      <footer>Emitido em ${U.fmtDate(r.issueDate)}${s.receiptNote ? ' · ' + esc(s.receiptNote) : ''}${r.number ? '' : '<br>Número provisório: será definido quando houver conexão com a internet. Imprima depois da sincronização.'}</footer></div>`;
  }

  function preview(r) {
    const m = UI.modal({ title: r.number ? `Recibo Nº ${r.number}` : 'Recibo (número provisório)', wide: true, footer: true, body: receiptHtml(r) });
    m.foot.innerHTML = '<span class="spacer"></span><button class="btn ghost" data-c>Fechar</button><button class="btn primary" data-p>Imprimir / salvar como PDF</button>';
    m.foot.querySelector('[data-c]').onclick = () => m.close();
    m.foot.querySelector('[data-p]').onclick = () => UI.print(receiptHtml(r));
  }
  A.viewReceipt = (id) => { const r = Rc.get(id); if (r) preview(r); };

  function receiptForm(pay) {
    const vals = pay
      ? { patientId: pay.patientId || '', payerName: nm(pay.patientId, pay.patientName) === '—' ? '' : nm(pay.patientId, pay.patientName), value: pay.value, date: pay.date, description: Rc.defaultDescription(pay), issueDate: U.today() }
      : { issueDate: U.today(), date: U.today(), description: 'Serviços de psicologia' };
    UI.form({
      title: pay ? 'Gerar recibo' : 'Novo recibo', values: vals, submitText: 'Gerar recibo',
      fields: [
        { key: 'patientId', label: 'Paciente cadastrada', type: 'select', options: UI.opts.patients('— nome digitado abaixo —') },
        { key: 'payerName', label: 'Recebido de (nome)', type: 'text', required: true },
        { key: 'value', label: 'Valor (R$)', type: 'money', required: true },
        { key: 'date', label: 'Data do pagamento', type: 'date', required: true },
        { key: 'issueDate', label: 'Data de emissão', type: 'date', required: true },
        { key: 'description', label: 'Descrição', type: 'textarea', required: true, hint: 'Ex.: sessão de psicoterapia, pacote mensal, avaliação.' },
      ],
      onChange: (k, v, set) => { if (k === 'patientId' && v.patientId) set('payerName', nm(v.patientId)); },
      onSubmit: async (v) => {
        if (!(Number(v.value) > 0)) throw new Error('Informe um valor maior que zero.');
        const rec = await Rc.issue({ paymentId: pay ? pay.id : '', patientId: v.patientId, payerName: v.payerName, value: Number(v.value), date: v.date, description: v.description, issueDate: v.issueDate });
        UI.toast('Recibo gerado.');
        CP.App.refresh();
        // tenta enviar já, para o banco numerar o recibo; sem internet, segue provisório
        (async () => {
          await Promise.race([CP.sync.flush(), new Promise((r) => setTimeout(r, 4000))]);
          CP.App.refresh();
          preview(Rc.get(rec.id) || rec);
        })();
      },
    });
  }
  A.issueReceipt = (paymentId) => { const p = Pay.get(paymentId); if (p) receiptForm(p); };
  A.newReceipt = () => receiptForm(null);

  /* ---------- Carnê-Leão ---------- */
  function carneForm(p) {
    UI.form({
      title: 'Registrar no Carnê-Leão', values: { carneDate: U.today() }, submitText: 'Marcar como registrado',
      fields: [{ key: 'carneDate', label: 'Data do registro', type: 'date', required: true }],
      onSubmit: async (v) => { await Pay.save({ ...p, carneLeao: true, carneDate: v.carneDate }); UI.toast('Registro no Carnê-Leão salvo.'); CP.App.refresh(); },
    });
  }

  function carneTab(box) {
    const all = Pay.all().filter((p) => p.status === 'pago');
    const waiting = all.filter((p) => !p.carneLeao);
    const rows = U.sortBy(all.filter((p) => {
      if (cf.status === 'registrado' && !p.carneLeao) return false;
      if (cf.status === 'pendente' && p.carneLeao) return false;
      if (cf.month && U.monthKey(p.date) !== cf.month) return false;
      if (cf.patient && p.patientId !== cf.patient) return false;
      return true;
    }), (p) => p.date, -1);
    box.innerHTML = `<section class="card"><div class="card-head"><h3>Controle Carnê-Leão</h3></div>
      <div class="sum-strip"><span>Pagamentos aguardando registro: <b>${waiting.length}</b></span><span>Valor: <b>${U.money(U.sum(waiting, (p) => p.value))}</b></span></div>
      ${UI.filters([
        { key: 'status', label: 'Situação', options: [['', 'Todos'], ['pendente', 'Pendente'], ['registrado', 'Registrado']] },
        { key: 'month', label: 'Mês', type: 'month' },
        { key: 'patient', label: 'Paciente', options: UI.opts.patients('Todas') },
      ], cf)}<div id="clist"></div></section>`;
    const draw = () => {
      const filtered = U.sortBy(all.filter((p) => (!cf.status || (cf.status === 'registrado') === !!p.carneLeao) && (!cf.month || U.monthKey(p.date) === cf.month) && (!cf.patient || p.patientId === cf.patient)), (p) => p.date, -1);
      box.querySelector('#clist').innerHTML = filtered.length ? UI.table([
        { label: 'Data', render: (p) => U.fmtDate(p.date) },
        { label: 'Paciente', render: (p) => `<strong>${esc(nm(p.patientId, p.patientName))}</strong>` },
        { label: 'Valor', cls: 'num', render: (p) => U.money(p.value) },
        { label: 'Referente', render: (p) => esc(UI.labelOf(Pay.REF, p.refType)) },
        { label: 'Recibo', render: (p) => UI.sb(p.receiptIssued ? 'sim' : 'nao', p.receiptIssued ? 'Emitido' : 'Pendente') },
        { label: 'Carnê-Leão', render: (p) => UI.sb(p.carneLeao ? 'sim' : 'nao', p.carneLeao ? 'Sim' : 'Não') },
        { label: 'Data do registro', render: (p) => U.fmtDate(p.carneDate) },
        { label: 'Status', render: (p) => UI.sb(p.carneLeao ? 'ok' : 'pendente', p.carneLeao ? 'Registrado' : 'Pendente') },
        { label: '', cls: 'act', render: (p) => `<div class="row-actions">${p.carneLeao ? `<button class="btn ghost sm" data-act="carne-undo" data-id="${p.id}">Desfazer</button>` : `<button class="btn soft sm" data-act="carne-reg" data-id="${p.id}">Registrar</button>`}${p.receiptIssued ? '' : `<button class="icon-btn" data-act="pay-receipt" data-id="${p.id}" title="Gerar recibo" aria-label="Gerar recibo">${UI.icon('receipt', 17)}</button>`}</div>` },
      ], filtered) : UI.empty({ icon: 'wallet', title: 'Nenhum pagamento neste filtro', text: 'Somente pagamentos com status “pago” aparecem aqui.' });
    };
    void rows;
    draw();
    UI.bindFilters(box, cf, draw);
    UI.delegate(box, async (act, id) => {
      const p = Pay.get(id); if (!p) return;
      if (act === 'carne-reg') carneForm(p);
      else if (act === 'carne-undo') { await Pay.save({ ...p, carneLeao: false, carneDate: '' }); UI.toast('Registro desfeito.'); CP.App.refresh(); }
      else if (act === 'pay-receipt') A.issueReceipt(id);
    });
  }

  /* ---------- Tela ---------- */
  function receiptsTab(box) {
    const list = U.sortBy(Rc.all(), (r) => r.issueDate + r.number, -1);
    const waiting = U.sortBy(Pay.awaitingReceipt(), (p) => p.date, -1);
    box.innerHTML = `${waiting.length ? `<section class="card"><h3>Pagamentos pagos sem recibo (${waiting.length})</h3>${waiting.slice(0, 8).map((p) => `<div class="list-row"><div><strong>${esc(nm(p.patientId, p.patientName))}</strong><small>${U.fmtDate(p.date)} · ${esc(UI.labelOf(Pay.REF, p.refType))}</small></div><div style="display:flex;gap:12px;align-items:center"><strong>${U.money(p.value)}</strong><button class="btn soft sm" data-act="pay-receipt" data-id="${p.id}">Gerar recibo</button></div></div>`).join('')}</section>` : ''}
      <section class="card section"><h3>Recibos emitidos</h3>${list.length ? UI.table([
        { label: 'Nº', render: (r) => (r.number ? `<strong>${esc(r.number)}</strong>` : UI.badge('Provisório', 'warn')) },
        { label: 'Emissão', render: (r) => U.fmtDate(r.issueDate) },
        { label: 'Paciente', render: (r) => esc(r.payerName) },
        { label: 'Descrição', render: (r) => esc(r.description) },
        { label: 'Valor', cls: 'num', render: (r) => U.money(r.value) },
        { label: '', cls: 'act', render: (r) => UI.actions([{ act: 'rc-view', id: r.id, icon: 'print', label: 'Ver / imprimir' }, { act: 'rc-del', id: r.id, icon: 'trash', label: 'Excluir', danger: true }]) },
      ], list) : UI.empty({ icon: 'receipt', title: 'Nenhum recibo emitido', text: 'Gere recibos a partir de pagamentos pagos ou crie um recibo avulso.', action: '<button class="btn soft" data-act="rc-new">+ Novo recibo</button>' })}</section>`;
    UI.delegate(box, async (act, id) => {
      if (act === 'pay-receipt') A.issueReceipt(id);
      else if (act === 'rc-view') A.viewReceipt(id);
      else if (act === 'rc-new') A.newReceipt();
      else if (act === 'rc-del') {
        const ok = await UI.confirm({ title: 'Excluir recibo', message: 'Excluir este recibo? O pagamento voltará a constar como “sem recibo”.', confirmText: 'Excluir', danger: true });
        if (!ok) return;
        await Rc.removeWithUnlink(id); UI.toast('Recibo excluído.'); CP.App.refresh();
      }
    });
  }

  CP.views.recibos = {
    tab: 'recibos',
    render(root) {
      const self = CP.views.recibos;
      root.innerHTML = UI.pageHead('Recibos', 'Emissão de recibos e controle do Carnê-Leão.', `<button class="btn primary" id="newRc">${UI.icon('plus', 18)} Novo recibo</button>`) +
        UI.tabs([['recibos', 'Recibos', Rc.all().length], ['carne', 'Carnê-Leão', Pay.awaitingCarne().length]], self.tab) + '<div id="box"></div>';
      const box = root.querySelector('#box');
      if (self.tab === 'carne') carneTab(box); else receiptsTab(box);
      UI.bindTabs(root, (t) => { self.tab = t; CP.views.recibos.render(root); });
      root.querySelector('#newRc').onclick = () => A.newReceipt();
    },
  };
  CP.receiptHtml = receiptHtml;
})();

</script>
  <script>
/* Financeiro: relatório mensal e anual (com impressão) */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, UI = CP.UI, esc = U.esc, F = CP.finance;
  let tab = 'mensal', month = U.thisMonth(), year = U.today().slice(0, 4);
  const nm = CP.patients.name;

  function monthHtml(m) {
    const s = F.monthSummary(m);
    const stats = [
      ['Receita recebida', U.money(s.received)], ['Receita prevista', U.money(s.expected)], ['A receber', U.money(s.toReceive)],
      ['Despesas (pagas)', U.money(s.expensesPaid)], ['Lucro', U.money(s.profit)], ['Pacientes atendidas', s.servedCount],
      ['Sessões realizadas', s.sessionsDone], ['Ticket médio', s.ticket == null ? '—' : U.money(s.ticket)],
    ];
    const cats = Object.entries(s.byCategory).sort((a, b) => b[1] - a[1]);
    return `<div class="grid g-stats">${stats.map(([l, v]) => UI.stat({ label: l, value: v })).join('')}</div>
      <section class="card section"><h3>Receita por paciente</h3>${s.perPatient.length ? UI.table([
        { label: 'Paciente', render: (r) => `<strong>${esc(r.name)}</strong>` },
        { label: 'Recebido', cls: 'num', render: (r) => U.money(r.paid) },
        { label: 'Previsto', cls: 'num', render: (r) => U.money(r.expected) },
        { label: 'A receber', cls: 'num', render: (r) => U.money(r.pending) },
      ], s.perPatient) : '<p>Nenhuma receita ou valor previsto neste mês.</p>'}</section>
      <section class="card section"><h3>Receita por produto</h3>${s.byProduct.length ? UI.table([
        { label: 'Produto', render: (r) => `<strong>${esc(r.name)}</strong>` },
        { label: 'Vendas', cls: 'num', render: (r) => r.qty },
        { label: 'Receita', cls: 'num', render: (r) => U.money(r.revenue) },
      ], s.byProduct) : '<p>Nenhuma venda paga neste mês.</p>'}</section>
      <section class="card section"><h3>Despesas pagas por categoria</h3>${cats.length ? UI.table([
        { label: 'Categoria', render: (r) => esc(CP.expenses.cap(r[0])) }, { label: 'Valor', cls: 'num', render: (r) => U.money(r[1]) },
      ], cats) : '<p>Nenhuma despesa paga neste mês.</p>'}</section>
      <section class="card section"><h3>Pendências</h3>
        <p><strong>Pagamentos pendentes (${s.pendingPayments.length}):</strong> ${s.pendingPayments.length ? s.pendingPayments.map((p) => `${esc(nm(p.patientId, p.patientName))} ${U.money(p.value)} (${U.fmtDate(p.date)})`).join('; ') : 'nenhum'}</p>
        <p><strong>Recibos pendentes (${s.receiptsPending.length}):</strong> ${s.receiptsPending.length ? s.receiptsPending.map((p) => `${esc(nm(p.patientId, p.patientName))} ${U.money(p.value)}`).join('; ') : 'nenhum'}</p>
        <p><strong>Carnê-Leão pendente (${s.carnePending.length}):</strong> ${s.carnePending.length ? s.carnePending.map((p) => `${esc(nm(p.patientId, p.patientName))} ${U.money(p.value)}`).join('; ') : 'nenhum'}</p></section>`;
  }

  function yearHtml(y) {
    const s = F.yearSummary(y);
    const stats = [
      ['Faturamento anual', U.money(s.revenue)], ['Despesas anuais', U.money(s.expenses)], ['Lucro anual', U.money(s.profit)],
      ['Média mensal', s.avg == null ? '—' : U.money(s.avg), s.avg == null ? '' : `Sobre ${s.activeMonths} mês(es) com movimento`],
      ['Melhor mês', s.best ? U.money(s.best.received) : '—', s.best ? U.monthLabel(s.best.month) : ''],
      ['Pior mês', s.worst ? U.money(s.worst.received) : '—', s.worst ? U.monthLabel(s.worst.month) : 'Precisa de 2 meses com receita'],
      ['Pacientes atendidas', s.served], ['Sessões realizadas', s.sessions], ['Avaliações', s.evaluations],
      ['Vendas de produtos', s.salesCount, U.money(s.salesRevenue)],
    ];
    return `<div class="grid g-stats">${stats.map(([l, v, sub]) => UI.stat({ label: l, value: v, sub })).join('')}</div>
      <section class="card section"><h3>Mês a mês</h3>${UI.table([
        { label: 'Mês', render: (r) => `<strong>${esc(U.MONTHS[+r.month.slice(5) - 1])}</strong>` },
        { label: 'Recebido', cls: 'num', render: (r) => U.money(r.received) },
        { label: 'Despesas', cls: 'num', render: (r) => U.money(r.expensesPaid) },
        { label: 'Lucro', cls: 'num', render: (r) => U.money(r.profit) },
      ], s.months)}</section>`;
  }

  CP.views.financeiro = {
    render(root) {
      const years = UI.opts.years();
      if (!years.includes(year)) years.push(year);
      root.innerHTML = UI.pageHead('Relatório financeiro', 'Cálculos feitos somente com o que foi registrado.', `<button class="btn soft" id="prt">${UI.icon('print', 18)} Imprimir</button>`) +
        UI.tabs([['mensal', 'Relatório mensal'], ['anual', 'Relatório anual']], tab) +
        `<div style="margin-bottom:18px">${tab === 'mensal' ? UI.monthNav(month) : `<label class="f" style="max-width:180px"><span>Ano</span><select id="ySel">${years.sort().reverse().map((y) => `<option ${y === year ? 'selected' : ''}>${y}</option>`).join('')}</select></label>`}</div><div id="rep"></div>`;
      const rep = root.querySelector('#rep');
      const html = tab === 'mensal' ? monthHtml(month) : yearHtml(year);
      rep.innerHTML = html;
      UI.bindTabs(root, (t) => { tab = t; CP.views.financeiro.render(root); });
      const ys = root.querySelector('#ySel'); if (ys) ys.onchange = () => { year = ys.value; CP.views.financeiro.render(root); };
      root.querySelectorAll('[data-nav]').forEach((b) => b.addEventListener('click', () => { month = U.addMonths(month, Number(b.dataset.nav)); CP.views.financeiro.render(root); }));
      root.querySelector('#prt').onclick = () => {
        const title = tab === 'mensal' ? `Relatório financeiro — ${U.monthLabel(month)}` : `Relatório financeiro anual — ${year}`;
        UI.print(`<div class="report"><h1>${esc(title)}</h1><p>${esc(CP.settings.get('name'))} · ${esc(CP.settings.get('profession'))}${CP.settings.get('crp') ? ' · CRP ' + esc(CP.settings.get('crp')) : ''}</p>${html}<p style="font-size:.8rem;margin-top:18px">Gerado em ${U.fmtDate(U.today())}. Documento administrativo e financeiro.</p></div>`);
      };
    },
  };
})();

</script>
  <script>
/* Despesas e despesas fixas */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, UI = CP.UI, esc = U.esc, E = CP.expenses, Fx = CP.fixed, A = CP.actions;
  let tab = 'lanc';
  const f = { month: U.thisMonth(), year: '', category: '', status: '' };

  function expenseForm(x, prefill) {
    UI.form({
      title: x ? 'Editar despesa' : 'Registrar despesa', submitText: x ? 'Salvar alterações' : 'Registrar despesa',
      values: x || { date: U.today(), status: 'pago', periodicity: 'unica', category: 'outros', ...prefill },
      fields: [
        { key: 'name', label: 'Nome', type: 'text', required: true, full: true },
        { key: 'category', label: 'Categoria', type: 'select', options: E.catOptions() },
        { key: 'value', label: 'Valor (R$)', type: 'money', required: true },
        { key: 'date', label: 'Data', type: 'date', required: true },
        { key: 'periodicity', label: 'Periodicidade', type: 'select', options: E.PERIOD },
        { key: 'status', label: 'Status', type: 'select', options: E.STATUS, hint: 'Só despesas “pagas” entram no cálculo do lucro.' },
        { key: 'note', label: 'Observação', type: 'textarea' },
      ],
      extraButtons: x ? [{ label: 'Excluir', cls: 'danger', onClick: (m) => { m.close(); A.deleteExpense(x.id); } }] : [],
      onSubmit: async (v) => {
        if (!(Number(v.value) > 0)) throw new Error('Informe um valor maior que zero.');
        await E.save({ ...(x || {}), ...v, value: Number(v.value) });
        UI.toast(x ? 'Despesa atualizada.' : 'Despesa registrada.'); CP.App.refresh();
      },
    });
  }
  A.newExpense = (prefill) => expenseForm(null, prefill || {});
  A.editExpense = (id) => { const x = E.get(id); if (x) expenseForm(x); };
  A.deleteExpense = async (id) => {
    const ok = await UI.confirm({ title: 'Excluir despesa', message: 'Excluir esta despesa?', confirmText: 'Excluir', danger: true });
    if (!ok) return; await E.remove(id); UI.toast('Despesa excluída.'); CP.App.refresh();
  };

  function fixedForm(x, prefill) {
    UI.form({
      title: x ? 'Editar despesa fixa' : 'Nova despesa fixa', submitText: x ? 'Salvar alterações' : 'Cadastrar',
      values: x || { periodicity: 'mensal', status: 'ativa', category: 'plataformas', ...prefill },
      fields: [
        { key: 'name', label: 'Nome', type: 'text', required: true, full: true, hint: 'Ex.: Claude, Canva, Internet, Hospedagem, Domínio.' },
        { key: 'category', label: 'Categoria', type: 'select', options: E.catOptions() },
        { key: 'value', label: 'Valor (R$)', type: 'money', required: true },
        { key: 'dueDay', label: 'Dia do vencimento', type: 'number', min: 1, max: 31 },
        { key: 'periodicity', label: 'Periodicidade', type: 'select', options: Fx.PERIOD },
        { key: 'dueMonth', label: 'Mês do vencimento (anuais)', type: 'select', options: [['', '—'], ...U.MONTHS.map((m, i) => [i + 1, m])], showIf: (v) => v.periodicity === 'anual' },
        { key: 'status', label: 'Status', type: 'select', options: Fx.STATUS },
      ],
      extraButtons: x ? [{ label: 'Excluir', cls: 'danger', onClick: (m) => { m.close(); A.deleteFixed(x.id); } }] : [],
      onSubmit: async (v) => {
        if (!(Number(v.value) > 0)) throw new Error('Informe um valor maior que zero.');
        if (v.periodicity === 'anual' && !v.dueMonth) throw new Error('Informe o mês de vencimento da despesa anual.');
        await Fx.save({ ...(x || {}), ...v, value: Number(v.value) });
        UI.toast(x ? 'Despesa fixa atualizada.' : 'Despesa fixa cadastrada.'); CP.App.refresh();
      },
    });
  }
  A.newFixed = (prefill) => fixedForm(null, prefill || {});
  A.editFixed = (id) => { const x = Fx.get(id); if (x) fixedForm(x); };
  A.deleteFixed = async (id) => {
    const ok = await UI.confirm({ title: 'Excluir despesa fixa', message: 'Excluir esta despesa fixa? Lançamentos já gerados permanecem.', confirmText: 'Excluir', danger: true });
    if (!ok) return; await Fx.remove(id); UI.toast('Despesa fixa excluída.'); CP.App.refresh();
  };

  function launchTab(root, box) {
    const draw = () => {
      const rows = U.sortBy(E.all().filter((x) => {
        if (f.month && U.monthKey(x.date) !== f.month) return false;
        if (!f.month && f.year && U.yearOf(x.date) !== f.year) return false;
        if (f.category && x.category !== f.category) return false;
        if (f.status && x.status !== f.status) return false;
        return true;
      }), (x) => x.date, -1);
      const paid = U.sum(rows.filter((x) => x.status === 'pago'), (x) => x.value), pend = U.sum(rows.filter((x) => x.status === 'pendente'), (x) => x.value);

  <script>
/* Produtos e vendas */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, UI = CP.UI, esc = U.esc, P = CP.products, S = CP.sales, A = CP.actions;
  let tab = 'prod';
  const sf = { month: '', product: '', status: '' };

  function productForm(p) {
    UI.form({
      title: p ? 'Editar produto' : 'Novo produto', submitText: p ? 'Salvar alterações' : 'Cadastrar produto', values: p || { status: 'ativo' },
      fields: [
        { key: 'name', label: 'Nome', type: 'text', required: true, full: true },
        { key: 'description', label: 'Descrição', type: 'textarea' },
        { key: 'price', label: 'Preço (R$)', type: 'money', required: true },
        { key: 'cost', label: 'Custo (R$)', type: 'money', hint: 'Custo por unidade vendida (opcional).' },
        { key: 'link', label: 'Link de venda', type: 'url', placeholder: 'https://', full: true },
        { key: 'status', label: 'Status', type: 'select', options: P.STATUS },
      ],
      extraButtons: p ? [{ label: 'Excluir', cls: 'danger', onClick: (m) => { m.close(); A.deleteProduct(p.id); } }] : [],
      onSubmit: async (v) => { await P.save({ ...(p || {}), ...v, price: Number(v.price) || 0, cost: Number(v.cost) || 0 }); UI.toast(p ? 'Produto atualizado.' : 'Produto cadastrado.'); CP.App.refresh(); },
    });
  }
  A.newProduct = () => productForm(null);
  A.editProduct = (id) => { const p = P.get(id); if (p) productForm(p); };
  A.deleteProduct = async (id) => {
    const ok = await UI.confirm({ title: 'Excluir produto', message: 'Excluir este produto? As vendas já registradas permanecem.', confirmText: 'Excluir', danger: true });
    if (!ok) return; await P.remove(id); UI.toast('Produto excluído.'); CP.App.refresh();
  };

  function saleForm(s, prefill) {
    if (!P.all().length) { UI.toast('Cadastre um produto antes de registrar uma venda.', 'err'); return A.newProduct(); }
    let auto = null;
    const vals = s || { date: U.today(), status: 'pago', method: 'pix', ...prefill };
    if (!s && vals.productId && vals.value == null) { const pr = P.get(vals.productId); if (pr) { vals.value = pr.price; auto = pr.price; } }
    UI.form({
      title: s ? 'Editar venda' : 'Registrar venda', submitText: s ? 'Salvar alterações' : 'Registrar venda', values: vals,
      fields: [
        { key: 'date', label: 'Data', type: 'date', required: true },
        { key: 'productId', label: 'Produto', type: 'select', required: true, options: [['', '— selecione —'], ...P.all().map((p) => [p.id, p.name])] },
        { key: 'client', label: 'Cliente', type: 'text' },
        { key: 'value', label: 'Valor (R$)', type: 'money', required: true },
        { key: 'method', label: 'Forma de pagamento', type: 'select', options: CP.payments.METHODS },
        { key: 'status', label: 'Status', type: 'select', options: S.STATUS },
      ],
      onChange: (k, v, set) => { if (k === 'productId') { const p = P.get(v.productId); if (p && (v.value == null || v.value === auto)) { set('value', p.price); auto = p.price; } } },
      extraButtons: s ? [{ label: 'Excluir', cls: 'danger', onClick: (m) => { m.close(); A.deleteSale(s.id); } }] : [],
      onSubmit: async (v) => { if (!(Number(v.value) > 0)) throw new Error('Informe um valor maior que zero.'); await S.save({ ...(s || {}), ...v, value: Number(v.value) }); UI.toast(s ? 'Venda atualizada.' : 'Venda registrada com sucesso.'); CP.App.refresh(); },
    });
  }
  A.newSale = (prefill) => saleForm(null, prefill || {});
  A.editSale = (id) => { const s = S.get(id); if (s) saleForm(s); };
  A.deleteSale = async (id) => {
    const ok = await UI.confirm({ title: 'Excluir venda', message: 'Excluir esta venda?', confirmText: 'Excluir', danger: true });
    if (!ok) return; await S.remove(id); UI.toast('Venda excluída.'); CP.App.refresh();
  };

  CP.views.produtos = {
    render(root) {
      const tot = P.stats(), mon = P.stats(null, U.thisMonth());
      root.innerHTML = UI.pageHead('Produtos', 'Ebooks e outros produtos digitais.', `<button class="btn soft" data-act="new-sale">${UI.icon('plus', 18)} Venda</button><button class="btn primary" data-act="new-prod">${UI.icon('plus', 18)} Produto</button>`) +
        `<div class="grid g-stats">${UI.stat({ label: 'Quantidade vendida', value: tot.qty, sub: `${mon.qty} no mês atual` })}${UI.stat({ label: 'Receita', value: U.money(tot.revenue), sub: `${U.money(mon.revenue)} no mês atual` })}${UI.stat({ label: 'Lucro', value: U.money(tot.profit), sub: 'Receita − custo das vendas pagas' })}</div>` +
        `<div class="section">${UI.tabs([['prod', 'Produtos', P.all().length], ['vend', 'Vendas', S.all().length]], tab)}<div id="box"></div></div>`;
      const box = root.querySelector('#box');
      if (tab === 'prod') {
        const list = U.sortBy(P.all(), (p) => U.norm(p.name));
        box.innerHTML = list.length ? `<section class="card">${UI.table([
          { label: 'Produto', render: (p) => `<strong>${esc(p.name)}</strong>${p.description ? `<br><small>${esc(p.description)}</small>` : ''}` },
          { label: 'Preço', cls: 'num', render: (p) => U.money(p.price) }, { label: 'Custo', cls: 'num', render: (p) => U.money(p.cost) },
          { label: 'Vendidos', cls: 'num', render: (p) => P.stats(p.id).qty }, { label: 'Receita', cls: 'num', render: (p) => U.money(P.stats(p.id).revenue) },
          { label: 'Lucro', cls: 'num', render: (p) => U.money(P.stats(p.id).profit) },
          { label: 'Link', render: (p) => (p.link ? `<a class="link-out" href="${esc(p.link)}" target="_blank" rel="noopener">${UI.icon('link', 15)} Abrir</a>` : '—') },
          { label: 'Status', render: (p) => UI.sb(p.status, UI.labelOf(P.STATUS, p.status)) },
          { label: '', cls: 'act', render: (p) => UI.actions([{ act: 'p-sale', id: p.id, icon: 'plus', label: 'Registrar venda' }, { act: 'p-edit', id: p.id, icon: 'edit', label: 'Editar' }, { act: 'p-del', id: p.id, icon: 'trash', label: 'Excluir', danger: true }]) },
        ], list)}</section>` : `<section class="card">${UI.empty({ icon: 'box', title: 'Nenhum produto cadastrado', text: 'Cadastre seu ebook com nome, preço e link de venda.', action: '<button class="btn soft" data-act="new-prod">+ Produto</button>' })}</section>`;
      } else {
        const draw = () => {
          const rows = U.sortBy(S.all().filter((s) => (!sf.month || U.monthKey(s.date) === sf.month) && (!sf.product || s.productId === sf.product) && (!sf.status || s.status === sf.status)), (s) => s.date, -1);
          box.querySelector('#slist').innerHTML = rows.length ? UI.table([
            { label: 'Data', render: (s) => U.fmtDate(s.date) }, { label: 'Produto', render: (s) => `<strong>${esc((P.get(s.productId) || {}).name || 'Produto removido')}</strong>` },
            { label: 'Cliente', render: (s) => esc(s.client || '—') }, { label: 'Valor', cls: 'num', render: (s) => U.money(s.value) },
            { label: 'Forma', render: (s) => esc(UI.labelOf(CP.payments.METHODS, s.method)) }, { label: 'Status', render: (s) => UI.sb(s.status, UI.labelOf(S.STATUS, s.status)) },
            { label: '', cls: 'act', render: (s) => UI.actions([{ act: 's-edit', id: s.id, icon: 'edit', label: 'Editar' }, { act: 's-del', id: s.id, icon: 'trash', label: 'Excluir', danger: true }]) },
          ], rows) : UI.empty({ icon: 'box', title: 'Nenhuma venda encontrada', text: 'Registre uma venda ou ajuste os filtros.' });
        };
        box.innerHTML = `<section class="card">${UI.filters([{ key: 'month', label: 'Mês', type: 'month' }, { key: 'product', label: 'Produto', options: UI.opts.list(P.all().map((p) => [p.id, p.name]), 'Todos') }, { key: 'status', label: 'Status', options: UI.opts.list(S.STATUS, 'Todos') }], sf)}<div id="slist"></div></section>`;
        draw(); UI.bindFilters(box, sf, draw);
      }
      UI.bindTabs(root, (t) => { tab = t; CP.views.produtos.render(root); });
      UI.delegate(root, (act, id) => {
        if (act === 'new-prod') A.newProduct(); else if (act === 'new-sale') A.newSale();
        else if (act === 'p-sale') A.newSale({ productId: id, value: (P.get(id) || {}).price });
        else if (act === 'p-edit') A.editProduct(id); else if (act === 'p-del') A.deleteProduct(id);
        else if (act === 's-edit') A.editSale(id); else if (act === 's-del') A.deleteSale(id);
      });
    },
  };
})();

  <script>
/* Configurações e backup */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, UI = CP.UI, esc = U.esc, B = CP.backup;

  async function exportBackup() {
    const payload = await B.export();
    U.download(`backup-consultorio-${U.today()}.json`, JSON.stringify(payload, null, 2));
    CP.settings.save({ lastBackup: new Date().toISOString() });
    UI.toast('Backup exportado.');
    CP.App.refresh();
  }

  /* Importar = adicionar/atualizar na nuvem a partir de um arquivo (nunca apaga o que já existe) */
  function importBackup() { CP.authUI.pickBackupFile((lg) => CP.authUI.runMigration(lg, { fromFile: true, onDone: () => CP.App.refresh() })); }

  async function clearLocal() {
    const st = CP.sync.state;
    if (st.pending + st.failed > 0) {
      UI.modal({ title: 'Há alterações não enviadas', body: `<p class="confirm-msg">Existem <strong>${st.pending + st.failed}</strong> alteração(ões) que ainda não chegaram à nuvem. Sincronize antes (botão de sincronização na barra superior) para não perdê-las.</p>` });
      return;
    }
    const ok = await UI.confirm({ title: 'Limpar dados deste aparelho', confirmText: 'Limpar', danger: true,
      message: 'Isso apaga <strong>somente a cópia deste aparelho</strong>. Os dados continuam salvos na nuvem e voltam na próxima sincronização (é preciso estar online).' });
    if (!ok) return;
    await CP.storage.wipeLocal(); CP.db.reset(); await CP.sync.resetMeta();
    UI.toast('Cópia local apagada. Baixando seus dados da nuvem…');
    await CP.sync.run({ reason: 'reload' }); await CP.db.load(); CP.App.refresh();
  }

  CP.views.configuracoes = {
    render(root) {
      const s = CP.settings.data;
      const last = s.lastBackup ? new Date(s.lastBackup).toLocaleString('pt-BR') : 'nunca';
      root.innerHTML = UI.pageHead('Configurações', 'Dados profissionais, recibos e backup.') +
        `<section class="card"><h3>Dados profissionais e do recibo</h3><form id="sf" class="form-grid" novalidate>
          <div class="field"><label>Nome profissional</label><input name="name" value="${esc(s.name)}"></div>
          <div class="field"><label>Profissão</label><input name="profession" value="${esc(s.profession)}"></div>
          <div class="field"><label>CRP</label><input name="crp" value="${esc(s.crp)}"></div>
          <div class="field"><label>Telefone</label><input name="phone" type="tel" value="${esc(s.phone)}"></div>
          <div class="field"><label>E-mail</label><input name="email" type="email" value="${esc(s.email)}"></div>
          <div class="field"><label>Chave Pix</label><input name="pix" value="${esc(s.pix)}"></div>
          <div class="field"><label>CPF/CNPJ no recibo (opcional)</label><input name="cpf" value="${esc(s.cpf)}"></div>
          <div class="field"><label>Endereço/cidade no recibo (opcional)</label><input name="address" value="${esc(s.address)}"></div>
          <div class="field span2"><label>Texto adicional do recibo (opcional)</label><textarea name="receiptNote" rows="2">${esc(s.receiptNote)}</textarea><small>Aparece no rodapé. Nenhuma informação fiscal é adicionada automaticamente.</small></div>
          <div class="field"><label>Meta financeira mensal (R$)</label><input name="monthlyGoal" type="number" step="0.01" min="0" inputmode="decimal" value="${s.monthlyGoal || ''}"></div>
          <div class="field"><label>Logo</label><div class="img-field"><img class="img-prev" id="logoPrev" alt="" ${s.logo ? `src="${esc(s.logo)}"` : 'hidden'}><div class="img-actions"><input type="file" id="logoIn" accept="image/*"><button type="button" class="btn ghost sm" id="logoRm">Remover logo</button></div></div></div>
          <div class="field span2"><label>Categorias de despesas (uma por linha)</label><textarea name="categories" rows="6">${esc((s.expenseCategories || []).join('\n'))}</textarea></div>
          <div class="form-error span2" id="sErr" hidden></div>
          <div class="span2"><button class="btn primary" type="submit">Salvar configurações</button></div></form></section>
        <section class="card section"><h3>Backup dos dados</h3>
          <p>Seus dados ficam salvos na nuvem e sincronizam entre os aparelhos. Mesmo assim, exporte um backup de vez em quando como cópia extra e guarde-o em local seguro (nunca em repositório público).</p>
          <p>Último backup: <strong>${esc(last)}</strong></p>
          <div class="head-actions"><button class="btn primary" id="bkExp">${UI.icon('download', 18)} Exportar meus dados (backup)</button>
          <button class="btn soft" id="bkImp">${UI.icon('upload', 18)} Importar backup</button>
          <button class="btn danger" id="bkClr">${UI.icon('trash', 18)} Limpar dados deste aparelho</button></div>
          <p style="margin-top:12px;font-size:.84rem">“Importar” <strong>adiciona e atualiza</strong> registros a partir do arquivo; não apaga o que já existe. “Limpar” remove só a cópia deste aparelho.</p></section>
        <div class="notice big">Este sistema é destinado exclusivamente à gestão administrativa e financeira. Não armazene informações clínicas ou dados sensíveis de pacientes.</div>`;

      let logo = s.logo || '';
      root.querySelector('#logoIn').addEventListener('change', async (e) => {
        const f = e.target.files[0]; if (!f) return;
        try { logo = await U.resizeImage(f, 400, 'image/png'); const p = root.querySelector('#logoPrev'); p.src = logo; p.hidden = false; } catch (err) { UI.toast(err.message, 'err'); }
      });
      root.querySelector('#logoRm').onclick = () => { logo = ''; root.querySelector('#logoPrev').hidden = true; root.querySelector('#logoIn').value = ''; };
      root.querySelector('#sf').addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const cats = String(fd.get('categories')).split('\n').map((c) => c.trim().toLowerCase()).filter(Boolean);
        try {
          CP.settings.save({
            name: String(fd.get('name')).trim(), profession: String(fd.get('profession')).trim(), crp: String(fd.get('crp')).trim(),
            phone: String(fd.get('phone')).trim(), email: String(fd.get('email')).trim(), pix: String(fd.get('pix')).trim(),
            cpf: String(fd.get('cpf')).trim(), address: String(fd.get('address')).trim(), receiptNote: String(fd.get('receiptNote')).trim(),
            monthlyGoal: Number(fd.get('monthlyGoal')) || 0, logo, logoPath: logo === s.logo ? s.logoPath : '',
            expenseCategories: cats.length ? [...new Set(cats)] : CP.settings.DEFAULTS.expenseCategories,
          });
          UI.toast('Configurações salvas.');
          CP.App.rebuildShell(); CP.App.refresh();
        } catch (err) { const b = root.querySelector('#sErr'); b.textContent = 'Não foi possível salvar (o logo pode ser grande demais). Tente uma imagem menor.'; b.hidden = false; }
      });
      root.querySelector('#bkExp').onclick = exportBackup;
      root.querySelector('#bkImp').onclick = importBackup;
      root.querySelector('#bkClr').onclick = clearLocal;
    },
  };
})();

    const err = root.querySelector('#lerr'), btn = root.querySelector('#lb');

  authUI.onboarding = async (root, done) => {
    root.innerHTML = shell('<div class="spinner" style="margin:18px auto"></div><p class="sub" style="text-align:center">Verificando seus dados…</p>');

    root.innerHTML = shell(`<h1>Bem-vinda ao seu consultório 🌷</h1>

        <button class="btn ghost" id="obEmpty">Começar vazio</button>
      </div>
      <div class="notice">Este sistema é destinado exclusivamente à gestão administrativa e financeira. Não armazene informações clínicas ou dados sensíveis de pacientes.</div>`);
    const finish = async () => { await CP.storage.metaSet('onboarded', true); await CP.settings.save({}); done(); };
    const imp = root.querySelector('#obImp');

    root.querySelector('#obFile').onclick = () => authUI.pickBackupFile((lg) => authUI.runMigration(lg, { fromFile: true, onDone: finish }));
    root.querySelector('#obEmpty').onclick = finish;
  };
})();

        <div class="notice big">Este sistema é destinado exclusivamente à gestão administrativa e financeira. Não armazene informações clínicas ou dados sensíveis de pacientes.</div>`;
      const sc = root.querySelector('#scard');

      root.querySelector('#chPw').onclick = () => UI.form({

  <script>
/* Busca global: paciente, pagamento, despesa, produto, lead, data */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, esc = U.esc;
  const A = CP.actions;

  function run(q) {
    const nq = U.norm(q.trim());
    if (nq.length < 2) return [];
    const dq = U.parseDateQuery(q);
    const dateHit = (d) => !!dq && !!d && (dq.type === 'day' ? d.slice(0, 10) === dq.value : U.monthKey(d) === dq.value);
    const has = (...vals) => vals.some((v) => U.norm(v).includes(nq));
    const nm = CP.patients.name;
    const g = [];
    const add = (title, items) => { if (items.length) g.push({ title, items: items.slice(0, 6) }); };

    add('Pacientes', CP.patients.all().filter((p) => has(p.name, p.phone, p.email, p.notes) || dateHit(p.evaluationDate) || dateHit(p.startDate))
      .map((p) => ({ label: p.name, sub: UI_label(CP.patients.STATUS, p.status), go: () => CP.App.go('pacientes', p.id) })));
    add('Pagamentos', CP.payments.all().filter((p) => has(nm(p.patientId, p.patientName), p.note, String(p.value), CP.payments.METHODS.find((m) => m[0] === p.method)?.[1]) || dateHit(p.date))
      .map((p) => ({ label: `${nm(p.patientId, p.patientName)} — ${U.money(p.value)}`, sub: `${U.fmtDate(p.date)} · ${UI_label(CP.payments.STATUS, p.status)}`, go: () => A.editPayment(p.id) })));
    add('Sessões', CP.sessions.all().filter((s) => has(nm(s.patientId, s.patientName), s.note) || dateHit(s.date))
      .map((s) => ({ label: `Sessão — ${nm(s.patientId, s.patientName)}`, sub: `${U.fmtDate(s.date)} · ${UI_label(CP.sessions.STATUS, s.status)}`, go: () => A.editSession(s.id) })));
    add('Despesas', CP.expenses.all().filter((x) => has(x.name, x.category, x.note) || dateHit(x.date))
      .map((x) => ({ label: `${x.name} — ${U.money(x.value)}`, sub: U.fmtDate(x.date), go: () => A.editExpense(x.id) })));
    add('Produtos e vendas', [
      ...CP.products.all().filter((p) => has(p.name, p.description)).map((p) => ({ label: p.name, sub: 'Produto', go: () => A.editProduct(p.id) })),
      ...CP.sales.all().filter((s) => has(s.client) || dateHit(s.date)).map((s) => ({ label: `Venda — ${s.client || 'cliente'} (${U.money(s.value)})`, sub: U.fmtDate(s.date), go: () => A.editSale(s.id) })),
    ]);
    add('Leads', CP.leads.all().filter((l) => has(l.name, l.interest, l.note) || dateHit(l.firstContact) || dateHit(l.nextContact))
      .map((l) => ({ label: l.name, sub: UI_label(CP.leads.STATUS, l.status), go: () => A.editLead(l.id) })));
    add('Follow-up', CP.followups.all().filter((f) => has(f.name, f.note) || dateHit(f.nextContact) || dateHit(f.lastContact))
      .map((f) => ({ label: f.name, sub: `Próximo: ${U.fmtDate(f.nextContact)}`, go: () => A.editFollowup(f.id) })));
    return g;
  }
  function UI_label(list, v) { const f = list.find((x) => x[0] === v); return f ? f[1] : v || ''; }

  CP.search = {
    run,
    init(input, box) {
      let results = [];
      const draw = () => {
        const q = input.value;
        if (U.norm(q.trim()).length < 2) { box.hidden = true; return; }
        results = run(q);
        let n = 0;
        box.innerHTML = results.length
          ? results.map((gr) => `<h5>${esc(gr.title)}</h5>${gr.items.map((it) => `<button data-i="${n++}">${esc(it.label)}<small>${esc(it.sub || '')}</small></button>`).join('')}`).join('')
          : '<p style="padding:12px;margin:0">Nenhum resultado encontrado.</p>';
        box.hidden = false;
      };
      input.addEventListener('input', U.debounce(draw, 150));
      input.addEventListener('focus', draw);
      box.addEventListener('click', (e) => {
        const b = e.target.closest('[data-i]'); if (!b) return;
        const flat = results.flatMap((gr) => gr.items);
        const it = flat[Number(b.dataset.i)];
        box.hidden = true; input.value = '';
        document.getElementById('topbar').classList.remove('search-open');
        if (it) it.go();
      });
      document.addEventListener('click', (e) => { if (!box.contains(e.target) && e.target !== input) box.hidden = true; });
      input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { box.hidden = true; input.blur(); } });
    },
  };
})();

/* Inicialização, login, rotas (hash) e estrutura da página */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, UI = CP.UI, S = CP.storage, esc = U.esc;

  const NAV = [
    ['dashboard', 'Dashboard', 'home'], ['pacientes', 'Pacientes', 'users'], ['agenda', 'Agenda', 'calendar'],
    ['pagamentos', 'Pagamentos', 'wallet'], ['recibos', 'Recibos', 'receipt'], ['financeiro', 'Financeiro', 'chart'],
    ['despesas', 'Despesas', 'tag'], ['produtos', 'Produtos', 'box'], ['leads', 'Leads', 'userplus'],
    ['followup', 'Follow-up', 'bell'], ['metas', 'Metas', 'flag'], ['conquistas', 'Conquistas', 'award'],
    ['evolucao', 'Evolução', 'trend'], ['configuracoes', 'Configurações', 'settings'], ['conta', 'Minha conta', 'user'],
  ];
  const BOTTOM = ['dashboard', 'pacientes', 'agenda', 'pagamentos'];
  const App = (CP.App = { current: { name: 'dashboard', param: null }, shell: false });
  const $ = (id) => document.getElementById(id);

  const parse = () => {
    const [name, param] = location.hash.replace(/^#\/?/, '').split('/');
    return { name: name || 'dashboard', param: param ? decodeURIComponent(param) : null };
  };
  App.go = (name, param) => {
    const target = '#/' + name + (param ? '/' + encodeURIComponent(param) : '');
    if (location.hash === target) App.refresh(); else location.hash = target;
  };
  App.refresh = () => { if (App.shell) render(true); };
  /* Atualização automática (vinda da sincronização) só quando não atrapalha quem está digitando */
  App.canAutoRefresh = () => {
    if (!App.shell || document.querySelector('.modal-backdrop')) return false;
    const t = document.activeElement && document.activeElement.tagName;
    return !/^(INPUT|TEXTAREA|SELECT)$/.test(t || '');
  };

  function render(keepScroll) {
    const r = parse();
    App.current = r;
    const root = $('view');
    const view = CP.views[r.name] || CP.views.dashboard;
    const sy = window.scrollY;
    try { root.innerHTML = ''; view.render(root, r.param); }
    catch (e) { console.error(e); root.innerHTML = `<div class="card"><h3>Não foi possível abrir esta tela</h3><p>${esc(e.message)}</p><a class="btn soft" href="#/dashboard">Voltar ao início</a></div>`; }
    markNav(r.name);
    window.scrollTo(0, keepScroll ? sy : 0);
  }

  function markNav(name) {
    const item = NAV.find((n) => n[0] === name) || NAV[0];
    const t = $('topTitle'); if (t) t.textContent = item[1];
    document.title = item[1] + ' · Meu Consultório';
    document.querySelectorAll('.nav a, .bottomnav a').forEach((a) => a.classList.toggle('on', a.dataset.r === item[0]));
    const more = $('moreBtn'); if (more) more.classList.toggle('on', !BOTTOM.includes(item[0]));
  }

  /* ---------- indicador Online/Offline ---------- */
  function paintSync(st) {
    const b = $('syncBadge'); if (!b) return;
    const hm = st.lastSync ? st.lastSync.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
    let dot = '🟢', text = 'Online', cls = 'ok';
    if (st.syncing) { dot = '🔄'; text = 'Sincronizando…'; cls = 'busy'; }
    else if (!st.online) { dot = '🔴'; text = 'Offline'; cls = 'off'; if (st.pending) text += ` · ${st.pending} aguardando envio`; }
    else {
      if (st.pending) { dot = '🟡'; text = `${st.pending} aguardando envio`; cls = 'warn'; }
      else if (hm) text = `Sincronizado às ${hm}`;
      else text = 'Online';
    }
    if (st.failed) { text += ` · ⚠ ${st.failed} com erro`; cls = 'warn'; }
    b.className = 'sync-badge ' + cls; b.title = text;
    b.innerHTML = `<span class="sync-dot">${dot}</span><span class="sync-text">${esc(text)}</span>`;
    const bar = $('offlineBar'); if (bar) bar.hidden = st.online !== false;
  }

  function buildShell() {
    const s = CP.settings.data;
    const mark = s.logo ? `<img src="${esc(s.logo)}" alt="">` : '<span>L</span>';
    $('sidebar').innerHTML = `
      <div class="brand"><div class="brand-mark">${mark}</div><div class="brand-name">Meu Consultório<small>${esc(s.name || '')}</small></div></div>
      <nav class="nav">${NAV.map(([k, l, i]) => `<a href="#/${k}" data-r="${k}">${UI.icon(i)}<span>${l}</span></a>`).join('')}</nav>
      <div class="side-foot">Sistema administrativo e financeiro.<br>Não armazene prontuários ou informações clínicas.</div>`;
    $('topbar').innerHTML = `
      <div class="top-title" id="topTitle"></div>
      <div class="search-box">${UI.icon('search', 18)}<input id="globalSearch" type="search" placeholder="Buscar paciente, pagamento, despesa, data…" autocomplete="off" aria-label="Busca global"><div id="searchResults" class="search-results" hidden></div></div>
      <button class="icon-btn" id="searchToggle" aria-label="Buscar">${UI.icon('search')}</button>
      <button class="sync-badge" id="syncBadge" aria-label="Estado da sincronização"></button>
      <button class="btn primary" id="topAdd">${UI.icon('plus', 18)} Novo</button>`;
    $('bottomnav').innerHTML =
      BOTTOM.map((k) => { const n = NAV.find((x) => x[0] === k); return `<a href="#/${k}" data-r="${k}">${UI.icon(n[2], 22)}<span>${n[1]}</span></a>`; }).join('') +
      `<button id="moreBtn">${UI.icon('more', 22)}<span>Mais</span></button>`;
    $('fab').onclick = CP.actions.quickAdd;
    $('topAdd').onclick = CP.actions.quickAdd;
    $('moreBtn').onclick = moreSheet;
    $('syncBadge').onclick = CP.openSyncPanel;
    $('searchToggle').onclick = () => {
      const tb = $('topbar'); tb.classList.toggle('search-open');
      if (tb.classList.contains('search-open')) $('globalSearch').focus();
    };
    CP.search.init($('globalSearch'), $('searchResults'));
    paintSync(CP.sync.state);
  }
  App.rebuildShell = () => { if (App.shell) { buildShell(); markNav(App.current.name); } };

  function moreSheet() {
    const m = UI.modal({ title: 'Menu', body: `<div class="quick-grid">${NAV.filter((n) => !BOTTOM.includes(n[0])).map(([k, l, i]) => `<a class="quick" href="#/${k}" data-close-me>${UI.icon(i, 22)}<span>${l}</span></a>`).join('')}</div>` });
    m.body.addEventListener('click', (e) => { if (e.target.closest('[data-close-me]')) m.close(); });
  }

  CP.actions.quickAdd = () => {
    const items = [['Paciente', 'users', 'newPatient'], ['Pagamento', 'wallet', 'newPayment'], ['Sessão', 'calendar', 'newSession'], ['Despesa', 'tag', 'newExpense'], ['Venda', 'box', 'newSale'], ['Lead', 'userplus', 'newLead'], ['Follow-up', 'bell', 'newFollowup'], ['Meta', 'flag', 'newGoal'], ['Conquista', 'award', 'newAchievement']];
    const m = UI.modal({ title: 'Adicionar', body: `<div class="quick-grid">${items.map(([l, i, a]) => `<button class="quick" data-a="${a}">${UI.icon(i, 22)}<span>+ ${l}</span></button>`).join('')}</div>` });
    m.body.addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (!b) return; m.close(); CP.actions[b.dataset.a](); });
  };

  /* ---------- fluxo de acesso ---------- */
  const setAuthMode = (on) => document.body.classList.toggle('auth-mode', on);
  App.showLogin = (msg) => { App.shell = false; setAuthMode(true); CP.authUI.login($('view'), msg); };
  App.onRecovery = () => { App.shell = false; setAuthMode(true); CP.authUI.recovery($('view')); };
  App.onSignedOut = (msg) => { if (App.loggingOut) return; CP.sync.stop(); App.showLogin(msg); };

  function enterApp() {
    setAuthMode(false); App.shell = true;
    buildShell(); render(false);
  }

  /* Abrir sem internet usando a réplica deste aparelho (somente quem já entrou aqui antes) */
  App.openOffline = async () => {
    const cached = CP.auth.cachedUser();
    const uid = await S.metaGet('uid');
    if (!cached || uid !== cached.id) { UI.toast('Não há dados salvos neste aparelho para abrir offline. Conecte-se à internet para entrar.', 'err'); return; }
    CP.auth.user = cached;
    await CP.sync.start(CP.auth.client, cached);
    enterApp();
  };

  App.afterLogin = async () => {
    const user = CP.auth.user;
    const prev = await S.metaGet('uid');
    if (prev && prev !== user.id) { await S.wipeLocal(); CP.db.reset(); CP.settings.reset(); await CP.sync.resetMeta(); }
    await S.metaSet('uid', user.id);
    setAuthMode(true); CP.authUI.loading($('view'), 'Sincronizando seus dados…');
    await CP.sync.start(CP.auth.client, user);
    await CP.db.load();
    const r = CP.sync.result, st = r && r.settings;
    const empty = CP.db.all('patients').length === 0;
    const onboarded = await S.metaGet('onboarded');
    if (CP.sync.state.online && empty && !onboarded && (!st || !st.found || !st.name)) {
      CP.authUI.onboarding($('view'), () => { enterApp(); });
    } else enterApp();
  };

  App.logout = async () => {
    const pend = CP.sync.state.pending + CP.sync.state.failed;
    const ok = await UI.confirm({
      title: 'Sair', confirmText: 'Sair', danger: pend > 0,
      message: pend > 0 ? `Há <strong>${pend} alteração(ões) ainda não enviada(s)</strong> à nuvem. Se sair agora, elas serão perdidas. Conecte-se e sincronize antes, ou saia mesmo assim.` : 'Deseja sair? Os dados deste aparelho serão removidos (eles continuam salvos na nuvem).',
    });
    if (!ok) return;
    App.loggingOut = true;
    await CP.auth.signOut();
    CP.sync.stop(); await S.wipeLocal(); CP.db.reset(); CP.settings.reset();
    App.loggingOut = false; App.shell = false;
    history.replaceState(null, '', location.pathname);
    App.showLogin();
  };

  function registerSW() {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch((e) => console.warn('sw', e));
  }

  async function boot() {
    if (App.booted) return;
    App.booted = true;
    const view = $('view');
    try {
      CP.settings.load();
      await S.init();
      await CP.db.load();
      CP.sync.onChange(paintSync);
      registerSW();
      window.addEventListener('hashchange', () => { if (!App.shell) return; const tb = $('topbar'); if (tb) tb.classList.remove('search-open'); render(false); });
      if (!window.supabase) throw new Error('A biblioteca de acesso não foi carregada.');
      const user = await CP.auth.init();
      await new Promise((r) => setTimeout(r, 60));            // permite o evento de recuperação de senha chegar
      if (CP.auth.recovery) { App.onRecovery(); return; }
      if (user) { await App.afterLogin(); return; }
      const cached = CP.auth.cachedUser(), uid = await S.metaGet('uid');
      if (cached && uid === cached.id && navigator.onLine === false) { await App.openOffline(); return; }
      App.showLogin();
    } catch (e) {
      console.error(e);
      setAuthMode(true);
      view.innerHTML = `<div class="auth-wrap"><div class="auth-card"><h1>Não foi possível iniciar</h1><p>${esc(e.message)}</p><p>Verifique a internet e recarregue a página.</p></div></div>`;
    }
  }
  document.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
