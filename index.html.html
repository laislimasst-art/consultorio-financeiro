/* Meu Consultório — identidade: off-white, rosé, vinho. */
:root{
  --bg:#F7F3F1; --rose-l:#E8D2D2; --rose:#C98F94; --burnt:#B26D70; --wine:#6E3F45; --gray:#5D5555; --white:#FFFFFF;
  --line:#EBDFDD; --soft:#FBF8F7; --ok-bg:#E6EEE7; --ok:#3E6A4B; --warn-bg:#F7EAD9; --warn:#8A5A1F; --bad-bg:#F5DADA; --bad:#8E2F36;
  --shadow:0 8px 28px rgba(110,63,69,.07); --shadow-lg:0 20px 50px rgba(80,40,46,.22);
  --r:18px; --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--gray);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);color:var(--wine);margin:0;font-weight:600;letter-spacing:.2px}
h1{font-size:2.15rem;line-height:1.1} h3{font-size:1.4rem} h4{font-size:1.15rem}
a{color:var(--burnt)} button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--burnt);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
[hidden]{display:none!important}

/* Layout */
#app{display:flex;min-height:100vh}
.sidebar{width:256px;flex:none;background:var(--white);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:26px 16px 18px;overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 24px}
.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--wine);display:grid;place-items:center;overflow:hidden;flex:none}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-mark span{font-family:var(--serif);font-size:1.5rem;color:var(--rose-l);line-height:1}
.brand-name{font-family:var(--serif);font-size:1.35rem;color:var(--wine);line-height:1.05;font-weight:600}
.brand-name small{display:block;font:500 .72rem var(--sans);color:var(--rose);letter-spacing:.3px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--gray);text-decoration:none;font-weight:500;transition:background .18s,color .18s}
.nav a:hover{background:var(--soft);color:var(--wine)}
.nav a.on{background:var(--rose-l);color:var(--wine)}
.side-foot{margin-top:auto;padding:18px 10px 0;font-size:.74rem;color:#8d8282;line-height:1.45}
.main{flex:1;margin-left:256px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:14px;padding:14px 32px;background:rgba(247,243,241,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-title{font-family:var(--serif);font-size:1.3rem;color:var(--wine);display:none}
.search-box{position:relative;flex:1;max-width:520px}
.search-box .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--rose)}
.search-box input{width:100%;height:44px;padding:0 14px 0 42px;border:1px solid var(--line);border-radius:14px;background:var(--white);font:inherit;color:var(--gray)}
.search-box input:focus{border-color:var(--rose);outline:none;box-shadow:0 0 0 4px rgba(201,143,148,.18)}
.search-results{position:absolute;top:52px;left:0;right:0;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);max-height:70vh;overflow:auto;padding:8px;z-index:30}
.search-results h5{margin:10px 10px 4px;font:600 .72rem var(--sans);color:var(--rose);letter-spacing:.3px}
.search-results button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;color:var(--gray)}

  .tbl td.act{width:100%}.tbl td.act:before{content:''}.tbl td.num{text-align:right}
  .tbl tbody tr:hover{background:var(--white)}
  .row-actions{justify-content:flex-end;width:100%}.icon-btn{width:44px;height:44px}
  /* agenda compacta */
  .day{min-height:54px;padding:5px;align-items:center}.day .chips{display:none}.day .dots{display:flex;justify-content:center}
  .cal{gap:4px}.filters .f{min-width:46%;flex:1}
  .receipt{padding:18px}
}
@media (max-width:420px){.g-stats{grid-template-columns:1fr}}

(function () {

  const U = (CP.U = {});
  const pad = (n) => String(n).padStart(2, '0');

  U.MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  U.WEEKDAYS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];

  // Identificador único (UUID v4) — gerado no próprio aparelho, também offline
  U.uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16); }));
  U.isUuid = (s) => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s || '');

  U.UUID_NS = 'a4f1c3de-6b0e-4c1a-9a55-3c1d2e7f9b10';
  U.uuid5 = async (name, ns = U.UUID_NS) => {
    const nsBytes = ns.replace(/-/g, '').match(/.{2}/g).map((h) => parseInt(h, 16));
    const data = new Uint8Array([...nsBytes, ...new TextEncoder().encode(name)]);
    const h = new Uint8Array(await crypto.subtle.digest('SHA-1', data)).slice(0, 16);
    h[6] = (h[6] & 0x0f) | 0x50; h[8] = (h[8] & 0x3f) | 0x80;
    const x = [...h].map((b) => b.toString(16).padStart(2, '0')).join('');
    return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
  };
  U.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      const img = new Image();

    };

  U.parseDateQuery = (q) => {
    q = String(q || '').trim();
    let m;
    if ((m = q.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return { type: 'day', value: `${m[3]}-${pad(m[2])}-${pad(m[1])}` };

  /* Valor por extenso (R$) */
  const UN = ['zero', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];

  const ate999 = (n) => {
    if (n === 0) return '';
    if (n === 100) return 'cem';
    const c = Math.floor(n / 100), r = n % 100, parts = [];
    if (c) parts.push(CT[c]);

    if (cent > 0) parts.push(inteiro(cent) + (cent === 1 ? ' centavo' : ' centavos'));
    return parts.join(' e ');
  };
})();

    async outboxDelete(seq) { mem.__outbox = mem.__outbox.filter((o) => o.seq !== seq); ls.persist(); },
    async metaGet(k) { return mem.__meta[k]; },
    async metaSet(k, v) { mem.__meta[k] = v; ls.persist(); },
    async wipe() { STORES.forEach((s) => { mem[s] = []; }); mem.__outbox = []; mem.__meta = {}; ls.persist(); },
  };
  const driver = () => (mode === 'indexeddb' ? idb : ls);

  const storage = (CP.storage = {
    STORES, ENTITIES,
    async init() {
      try { db = await idb.open(); mode = 'indexeddb'; }
      catch (e) { console.warn('IndexedDB indisponível, usando localStorage.', e); mode = 'localStorage'; ls.load(); }
      return mode;
    },
    get mode() { return mode; },
    getAll: (s) => driver().getAll(s),
    put: (s, rec) => driver().put(s, rec),
    remove: (s, id) => driver().remove(s, id),
    replaceAll: (data) => driver().replaceAll(data),
    async exportAll() { const data = {}; for (const s of STORES) data[s] = await driver().getAll(s); return data; },
    outboxAll: () => driver().outboxAll(),
    outboxPut: (op) => driver().outboxPut(op),
    outboxDelete: (seq) => driver().outboxDelete(seq),
    metaGet: (k) => driver().metaGet(k),
    metaSet: (k, v) => driver().metaSet(k, v),
    wipeLocal: () => driver().wipe(),   // apaga SOMENTE a réplica deste aparelho

    getSettings() { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch (e) { return {}; } },
    saveSettings(obj) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(obj)); },
    clearSettings() { localStorage.removeItem(SETTINGS_KEY); },

    /* Leitura (somente leitura) dos dados da Fase 1 neste navegador */
    async readLegacy() {
      const data = {}; let found = false;
      if (window.indexedDB) {
        const ldb = await new Promise((res) => {
          let r; try { r = indexedDB.open(LEGACY_DB); } catch (e) { return res(null); }
          r.onupgradeneeded = (e) => { try { e.target.transaction.abort(); } catch (x) { /* banco não existia */ } };
          r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
        });
        if (ldb) {
          for (const s of STORES) {
            if (!ldb.objectStoreNames.contains(s)) continue;
            data[s] = await new Promise((res) => { const q = ldb.transaction(s).objectStore(s).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); });
            if (data[s].length) found = true;
          }
          ldb.close();
        }
      }
      if (!found) {
        try { const m = JSON.parse(localStorage.getItem(LEGACY_FALLBACK)); if (m) STORES.forEach((s) => { data[s] = m[s] || []; if (data[s].length) found = true; }); } catch (e) { /* sem dados */ }
      }
      let settings = {}; try { settings = JSON.parse(localStorage.getItem(LEGACY_SETTINGS)) || {}; } catch (e) { /* nada */ }
      STORES.forEach((s) => { data[s] = data[s] || []; });
      return found ? { data, settings } : null;
    },
    deleteLegacy() {
      return new Promise((res) => {
        try { localStorage.removeItem(LEGACY_FALLBACK); localStorage.removeItem(LEGACY_SETTINGS); } catch (e) { /* nada */ }
        if (!window.indexedDB) return res();
        const r = indexedDB.deleteDatabase(LEGACY_DB); r.onsuccess = r.onerror = r.onblocked = () => res();
      });
    },
  });

  Object.entries(ENTITIES).forEach(([store, [plural, singular]]) => {
    storage['get' + plural] = () => storage.getAll(store);
    storage['save' + singular] = (rec) => storage.put(store, rec);
    storage['delete' + singular] = (id) => storage.remove(store, id);
  });
})();

/*
 * Cache em memória + fábrica de serviços.
 * Toda gravação: (1) réplica local (IndexedDB) → (2) fila de envio (sync.js) → nuvem.
 */
(function () {
  'use strict';
  const CP = window.CP, S = CP.storage;
  const cache = {};
  S.STORES.forEach((s) => { cache[s] = []; });

  CP.db = {
    async load() { for (const s of S.STORES) cache[s] = await S.getAll(s); },
    reset() { S.STORES.forEach((s) => { cache[s] = []; }); },
    all: (store) => cache[store],
    get: (store, id) => cache[store].find((x) => x.id === id),
    // grava só na réplica local (usado pela sincronização; NÃO entra na fila de envio)
    async putLocal(store, rec) {
      await S.put(store, rec);
      const i = cache[store].findIndex((x) => x.id === rec.id);
      if (i >= 0) cache[store][i] = rec; else cache[store].push(rec);
    },
    async removeLocal(store, id) { await S.remove(store, id); cache[store] = cache[store].filter((x) => x.id !== id); },
  };

  CP.makeService = function (store) {
    const singular = S.ENTITIES[store][1];
    return {
      store,
      all: () => cache[store],
      get: (id) => cache[store].find((x) => x.id === id),
      async save(rec) {
        const now = new Date().toISOString();
        const out = { ...rec };
        if (!out.id) { out.id = CP.U.uid(); out.createdAt = now; }
        out.updatedAt = now;
        await S['save' + singular](out);
        const i = cache[store].findIndex((x) => x.id === out.id);
        if (i >= 0) cache[store][i] = out; else cache[store].push(out);
        if (CP.sync) await CP.sync.queueUpsert(store, out.id);
        return out;
      },
      async remove(id) {
        await S['delete' + singular](id);
        cache[store] = cache[store].filter((x) => x.id !== id);
        if (CP.sync) await CP.sync.queueDelete(store, id);
      },
    };
  };

  /* Configurações: cópia local (localStorage) + envio para user_settings */
  CP.settings = {
    DEFAULTS: {
      name: 'Laís Rodrigues', profession: 'Psicóloga', crp: '05/63116',
      phone: '', email: '', pix: '', cpf: '', address: '', receiptNote: '', logo: '', logoPath: '',
      monthlyGoal: 0, lastBackup: '',
      expenseCategories: ['plataformas', 'internet', 'energia', 'marketing', 'cursos', 'supervisão', 'materiais', 'hospedagem', 'domínio', 'outros'],
    },
    data: {},
    load() { this.data = { ...this.DEFAULTS, ...S.getSettings() }; },
    get(k) { return this.data[k]; },
    saveLocal(partial) { const next = { ...this.data, ...partial }; S.saveSettings(next); this.data = next; },
    save(partial) { this.saveLocal(partial); return CP.sync ? CP.sync.queueSettings() : Promise.resolve(); },
    reset() { S.clearSettings(); this.data = { ...this.DEFAULTS }; },
  };
})();

  M.defs = {

      async toRows(r) {
        return { pre: [], row: { id: r.id, legacy_id: nn(r.legacyId), title: r.title, achievement_date: r.date, description: nn(r.description), value: nz(r.value), image_path: nn(r.imagePath) } };

      },

    },
  };

  /* Ordem em que as tabelas são baixadas/enviadas (pais antes dos filhos) */

  /* Configurações ⇄ user_settings */
  M.settingsToRow = (st, uid) => ({

    address: s(w.address), receiptNote: s(w.receipt_note), logoPath: s(w.logo_path), monthlyGoal: num(w.default_goal) || 0,
    expenseCategories: w.expense_categories && w.expense_categories.length ? w.expense_categories : CP.settings.DEFAULTS.expenseCategories, lastBackup: s(w.last_backup_at),
  });
})();

  <script>
/*
 * SINCRONIZAÇÃO  (réplica local ⇄ Supabase)
 *  • Toda alteração é gravada primeiro neste aparelho e entra numa FILA ("outbox").
 *  • Com internet, a fila é enviada em ordem; sem internet, fica guardada e é enviada depois.
 *  • Depois de enviar, o app baixa o que mudou na nuvem (outros aparelhos) — só as alterações.
 *  • Nada é dado como "sincronizado" sem a nuvem confirmar.
 */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, S = CP.storage, M = CP.mappers;
  const Sync = (CP.sync = {
    state: { online: navigator.onLine !== false, syncing: false, lastSync: null, pending: 0, failed: 0, lastError: '', progress: null, ready: false },
    client: null, user: null,
  });
  const listeners = [];
  Sync.onChange = (fn) => listeners.push(fn);
  let ob = [];                              // fila em memória (espelho da fila gravada)
  let meta = { pull: {}, pkgmap: {} };
  let running = null, rerun = false, timer = null, lastReconcile = 0;

  const recount = () => { Sync.state.pending = ob.filter((o) => !o.failed).length; Sync.state.failed = ob.filter((o) => o.failed).length; };
  const emit = () => { recount(); listeners.forEach((f) => { try { f(Sync.state); } catch (e) { console.warn(e); } }); };
  Sync.outbox = () => ob;
  Sync.emit = emit;

  /* ---------- fila ---------- */
  async function enqueue(store, id, op) {
    const ex = ob.find((o) => o.store === store && o.id === id);
    if (ex) {
      ex.op = op === 'delete' ? 'delete' : 'upsert';
      ex.failed = false; ex.error = '';
      await S.outboxPut(ex);
    } else {
      const o = { store, id, op, ts: Date.now() };
      await S.outboxPut(o); ob.push(o);
    }
    emit(); schedule();
  }
  Sync.queueUpsert = (store, id) => enqueue(store, id, 'upsert');
  Sync.queueDelete = (store, id) => enqueue(store, id, 'delete');
  Sync.queueSettings = () => enqueue('settings', 'me', 'upsert');
  const isPending = (store, id) => ob.some((o) => o.store === store && o.id === id);
  function schedule() { clearTimeout(timer); timer = setTimeout(() => Sync.run({ reason: 'change' }), 700); }

  /* ---------- erros ---------- */
  function check(error) {
    if (!error) return;
    const e = new Error(error.message || 'Erro desconhecido');
    e.code = error.code || ''; e.status = error.status; e.details = error.details || '';
    e.network = (!error.code && /failed to fetch|networkerror|load failed|network request failed|fetch|timeout/i.test(error.message || '')) || error.status === 0;
    throw e;
  }
  const isNetwork = (e) => !!e && (e.network === true || (e.name === 'TypeError' && /fetch|network/i.test(e.message || '')));
  const isAuth = (e) => !!e && (e.status === 401 || e.code === 'PGRST301' || e.code === 'PGRST303' || /jwt/i.test(e.message || ''));
  Sync.humanError = (e) => {
    const c = e && e.code;
    if (c === '23514') return 'Algum valor não passou na validação do banco (por exemplo, observação com mais de 500 caracteres ou valor inválido).';
    if (c === '23503') return 'Este registro depende de outro que não existe (ou foi removido). Verifique a paciente/produto ligado a ele.';
    if (c === '23505') return 'Registro duplicado (por exemplo, já existe recibo para este pagamento).';
    if (c === '23001') return e.message;
    if (c === '42501') return 'Sem permissão. Saia e entre novamente.';
    return (e && e.message) || 'Erro desconhecido.';
  };

  /* ---------- imagens (Storage privado) ---------- */
  const dataUrlToBlob = (d) => { const [h, b] = d.split(','); const mime = (h.match(/:(.*?);/) || [])[1] || 'image/jpeg'; const bin = atob(b); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); };
  const blobToDataUrl = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
  const extOf = (d) => (/png/.test(d.slice(0, 20)) ? 'png' : 'jpg');
  async function upload(path, dataUrl) {
    const blob = dataUrlToBlob(dataUrl);
    const { error } = await Sync.client.storage.from('user-files').upload(path, blob, { upsert: true, contentType: blob.type });
    check(error);
  }
  async function download(path) {
    const { data, error } = await Sync.client.storage.from('user-files').download(path);
    check(error); return blobToDataUrl(data);
  }
  async function ensureImage(store, rec) {
    if (store !== 'achievements') return rec;
    const uid = Sync.user.id;
    if (rec.image && rec.image.startsWith('data:') && !rec.imagePath) {
      const path = `${uid}/ach-${rec.id}.${extOf(rec.image)}`;
      await upload(path, rec.image);
      rec = { ...rec, imagePath: path }; await CP.db.putLocal(store, rec);
    } else if (!rec.image && rec.imagePath) {
      try { await Sync.client.storage.from('user-files').remove([rec.imagePath]); } catch (e) { /* melhor esforço */ }
      rec = { ...rec, imagePath: '' }; await CP.db.putLocal(store, rec);
    }
    return rec;
  }

  /* ---------- ENVIO ---------- */
  async function pushOne(op) {
    const c = Sync.client, uid = Sync.user.id;
    if (op.store === 'settings') return pushSettings();
    const def = M.defs[op.store];
    if (op.op === 'delete') { const { error } = await c.from(def.table).delete().eq('id', op.id); check(error); return; }
    let rec = CP.db.get(op.store, op.id);
    if (!rec) return;                                  // já foi removido localmente
    rec = await ensureImage(op.store, rec);
    const { row, pre, provisional } = await def.toRows(rec, { uid });
    for (const p of pre) { const r = await c.from(p.table).upsert(p.row, { onConflict: 'id' }); check(r.error); }
    let res;
    if (op.store === 'receipts' && provisional) {
      // recibo novo: o banco atribui o número. INSERT simples (se já existir, adota o existente).
      res = await c.from('receipts').insert(row).select().single();
      if (res.error && res.error.code === '23505') {
        const ex = await c.from('receipts').select('*').eq('id', row.id).maybeSingle();
        if (ex.data) res = ex; else check(res.error);
      }
    } else {
      res = await c.from(def.table).upsert(row, { onConflict: 'id' }).select().single();
    }
    check(res.error);
    if (op.store === 'receipts' && res.data) {
      const cur = CP.db.get('receipts', op.id);
      if (cur) await CP.db.putLocal('receipts', { ...cur, number: res.data.receipt_number, issueDate: res.data.issue_date });
    }
  }
  async function pushSettings() {
    const c = Sync.client, uid = Sync.user.id;
    let st = { ...CP.settings.data };
    if (st.logo && st.logo.startsWith('data:') && !st.logoPath) {
      const path = `${uid}/logo.${extOf(st.logo)}`; await upload(path, st.logo);
      CP.settings.saveLocal({ logoPath: path }); st.logoPath = path;
    } else if (!st.logo && st.logoPath) {
      try { await c.storage.from('user-files').remove([st.logoPath]); } catch (e) { /* melhor esforço */ }
      CP.settings.saveLocal({ logoPath: '' }); st.logoPath = '';
    }
    const { error } = await c.from('user_settings').upsert(M.settingsToRow(st, uid), { onConflict: 'user_id' });
    check(error);
  }
  async function pushAll() {
    const ops = ob.slice().sort((a, b) => a.seq - b.seq).filter((o) => !o.failed);
    const total = ops.length; let done = 0;
    for (const op of ops) {
      try {
        await pushOne(op);
        await S.outboxDelete(op.seq); ob = ob.filter((o) => o !== op);
      } catch (e) {
        if (isNetwork(e)) throw e;
        if (isAuth(e)) { e.auth = true; throw e; }
        console.warn('Falha ao enviar', op, e);
        op.failed = true; op.error = Sync.humanError(e); await S.outboxPut(op);
      }
      done++; Sync.state.progress = { done, total }; emit();
    }
  }

  /* ---------- DOWNLOAD (só o que mudou) ---------- */
  async function pageAll(build) {
    const out = []; let from = 0;
    for (;;) {
      const { data, error } = await build(from, from + 999); check(error);
      out.push(...(data || []));
      if (!data || data.length < 1000) break;
      from += 1000;
    }
    return out;
  }
  async function pullPackages() {
    const rows = await pageAll((a, b) => Sync.client.from('packages').select('id,patient_id,reference_month,sessions_count').order('id').range(a, b));
    rows.forEach((r) => { meta.pkgmap[r.id] = { patientId: r.patient_id, month: String(r.reference_month).slice(0, 7), size: r.sessions_count }; });
  }
  async function pullTable(store) {
    const def = M.defs[store], col = def.cursor || 'updated_at', since = meta.pull[store] || null;
    const rows = await pageAll((a, b) => { let q = Sync.client.from(def.table).select('*').order(col, { ascending: true }).order('id').range(a, b); if (since) q = q.gte(col, since); return q; });
    let changed = 0, max = since;
    for (const w of rows) {
      if (!max || w[col] > max) max = w[col];
      if (isPending(store, w.id)) continue;                        // alteração local ainda não enviada: ela vence
      const cur = CP.db.get(store, w.id);
      if (cur && cur.updatedAt === (w.updated_at || w.created_at) && store !== 'sessions' && store !== 'payments') continue;
      let rec = def.fromRow(w, meta);
      if (store === 'achievements') {
        rec.image = cur && cur.image && cur.imagePath === rec.imagePath ? cur.image : '';
        if (rec.imagePath && !rec.image) { try { rec.image = await download(rec.imagePath); } catch (e) { console.warn('imagem', e); } }
      }
      await CP.db.putLocal(store, rec); changed++;
    }
    meta.pull[store] = max;
    return changed;
  }
  async function pullSettings() {
    const { data, error } = await Sync.client.from('user_settings').select('*').maybeSingle();
    check(error);
    if (!data || isPending('settings', 'me')) return { found: !!data, name: data && data.professional_name };
    // linha criada automaticamente e ainda nunca configurada: mantém os valores locais (nome, CRP…) e deixa o app enviá-los
    if (!data.professional_name) return { found: true, name: null };
    const next = M.settingsFromRow(data);
    if (next.logoPath) {
      if (next.logoPath === CP.settings.get('logoPath') && CP.settings.get('logo')) next.logo = CP.settings.get('logo');
      else { try { next.logo = await download(next.logoPath); } catch (e) { next.logo = ''; } }
    } else next.logo = '';
    CP.settings.saveLocal(next);
    return { found: true, name: data.professional_name };
  }
  /* Apaga localmente o que foi excluído em outro aparelho */
  async function reconcile() {
    let removed = 0;
    for (const store of M.order) {
      const def = M.defs[store];
      const ids = new Set((await pageAll((a, b) => Sync.client.from(def.table).select('id').order('id').range(a, b))).map((r) => r.id));
      const local = CP.db.all(store).filter((r) => !isPending(store, r.id));
      if (ids.size === 0 && local.length) continue;                // proteção: resposta vazia nunca apaga a réplica
      for (const r of local) if (!ids.has(r.id)) { await CP.db.removeLocal(store, r.id); removed++; }
    }
    return removed;
  }
  async function pullAll(opts = {}) {
    let changed = 0;
    await pullPackages();
    for (const store of M.order) changed += await pullTable(store);
    const st = await pullSettings();
    if (opts.full || Date.now() - lastReconcile > 120000 || !meta.reconciled) { changed += await reconcile(); lastReconcile = Date.now(); meta.reconciled = true; }
    await S.metaSet('pull', meta.pull); await S.metaSet('pkgmap', meta.pkgmap);
    return { changed, settings: st };
  }

  /* ---------- execução ---------- */
  Sync.run = (opts = {}) => {
    if (!Sync.client || !Sync.user) return Promise.resolve();
    if (running) { rerun = true; return running; }
    if (navigator.onLine === false) { Sync.state.online = false; emit(); return Promise.resolve(); }
    running = (async () => {
      Sync.state.syncing = true; Sync.state.progress = null; emit();
      let result = null;
      try {
        await pushAll();
        result = await pullAll(opts);
        Sync.state.online = true; Sync.state.lastSync = new Date(); Sync.state.lastError = '';
        Sync.result = result;
      } catch (e) {
        if (isNetwork(e)) { Sync.state.online = false; }
        else if (e && e.auth) { Sync.state.lastError = 'Sessão expirada. Entre novamente.'; if (CP.auth) CP.auth.handleExpired(); }
        else { Sync.state.lastError = Sync.humanError(e); console.warn('Sincronização:', e); }
      } finally {
        Sync.state.syncing = false; Sync.state.progress = null; running = null; emit();
      }
      if (result && result.changed && !opts.silent && CP.App && CP.App.canAutoRefresh()) CP.App.refresh();
      if (rerun) { rerun = false; return Sync.run(opts); }
      return result;
    })();
    return running;
  };
  Sync.flush = () => Sync.run({ reason: 'flush' });

  Sync.retryFailed = async () => { for (const o of ob.filter((x) => x.failed)) { o.failed = false; o.error = ''; await S.outboxPut(o); } emit(); return Sync.run({ reason: 'retry' }); };
  /* Descartar uma alteração com erro: o registro volta a ser igual ao da nuvem (ou some, se nunca chegou lá) */
  Sync.discard = async (seq) => {
    const o = ob.find((x) => x.seq === seq); if (!o) return;
    await S.outboxDelete(seq); ob = ob.filter((x) => x !== o); emit();
    if (o.store !== 'settings' && Sync.client) {
      try {
        const def = M.defs[o.store];
        const { data, error } = await Sync.client.from(def.table).select('*').eq('id', o.id).maybeSingle();
        check(error);
        if (data) await CP.db.putLocal(o.store, def.fromRow(data, meta)); else await CP.db.removeLocal(o.store, o.id);
      } catch (e) { console.warn('discard', e); }
    }
    emit();
    return Sync.run({ reason: 'discard' });
  };

  Sync.start = async (client, user) => {
    Sync.client = client; Sync.user = user;
    ob = await S.outboxAll();
    meta.pull = (await S.metaGet('pull')) || {}; meta.pkgmap = (await S.metaGet('pkgmap')) || {};
    Sync.state.ready = true; emit();
    if (!Sync.started) {
      Sync.started = true;
      window.addEventListener('online', () => { Sync.state.online = true; emit(); Sync.run({ reason: 'online' }); });
      window.addEventListener('offline', () => { Sync.state.online = false; emit(); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.run({ reason: 'visible' }); });
      setInterval(() => { if (document.visibilityState === 'visible') Sync.run({ reason: 'timer' }); }, 60000);
    }
    return Sync.run({ reason: 'start' });
  };
  Sync.stop = () => { Sync.client = null; Sync.user = null; ob = []; meta = { pull: {}, pkgmap: {} }; Sync.state.ready = false; emit(); };
  Sync.resetMeta = async () => { meta = { pull: {}, pkgmap: {} }; ob = []; };
  Sync.getMeta = () => meta;
})();

/* Autenticação (Supabase Auth): entrar, sair, recuperar e trocar senha */
(function () {
  'use strict';
  const CP = window.CP;
  const Auth = (CP.auth = { client: null, user: null, recovery: false, remember: true });

  const friendly = (e) => {
    const m = (e && e.message) || '';
    if (/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/email not confirmed/i.test(m)) return 'Este e-mail ainda não foi confirmado.';
    if (/rate limit|too many|429/i.test(m) || (e && e.status === 429)) return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
    if (/failed to fetch|network|fetch/i.test(m)) return 'Sem conexão com a internet. Verifique e tente novamente.';
    if (/password should be at least|weak/i.test(m)) return 'A senha é muito fraca. Use pelo menos 10 caracteres.';
    if (/same password|different from the old/i.test(m)) return 'A nova senha precisa ser diferente da atual.';
    return m || 'Não foi possível concluir. Tente novamente.';
  };
  Auth.friendly = friendly;

  function attach() {
    Auth.client.auth.onAuthStateChange((event, session) => {
      // (não chamar métodos do Supabase aqui dentro; apenas guardar e agir depois)
      setTimeout(() => {
        if (event === 'PASSWORD_RECOVERY') { Auth.recovery = true; Auth.user = session && session.user; if (CP.App && CP.App.onRecovery) CP.App.onRecovery(); }
        else if (event === 'SIGNED_OUT' && CP.App && CP.App.onSignedOut) CP.App.onSignedOut();
        else if (session && session.user) Auth.user = session.user;
      }, 0);
    });
  }
  Auth.makeClient = (remember) => {
    const storage = remember ? window.localStorage : window.sessionStorage;
    return window.supabase.createClient(CP.config.SUPABASE_URL, CP.config.SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce', storage },
    });
  };

  /* Usuária que já entrou neste aparelho (permite abrir offline com a réplica local) */
  Auth.cachedUser = () => {
    for (const st of [window.localStorage, window.sessionStorage]) {
      try {
        for (let i = 0; i < st.length; i++) {
          const k = st.key(i);
          if (/^sb-.*-auth-token$/.test(k)) { const v = JSON.parse(st.getItem(k)); if (v && v.user && v.user.id) return v.user; }
        }
      } catch (e) { /* ignora */ }
    }
    return null;
  };

  Auth.init = async () => {
    Auth.remember = localStorage.getItem('cp_remember') !== '0';
    Auth.client = Auth.makeClient(Auth.remember);
    attach();
    let session = null;
    try { const r = await Auth.client.auth.getSession(); session = r.data && r.data.session; } catch (e) { /* offline */ }
    Auth.user = session ? session.user : null;
    return Auth.user;
  };

  Auth.signIn = async (email, password, remember) => {
    localStorage.setItem('cp_remember', remember ? '1' : '0');
    if (remember !== Auth.remember) {
      try { Auth.client.auth.stopAutoRefresh(); } catch (e) { /* nada */ }
      Auth.remember = remember; Auth.client = Auth.makeClient(remember); attach();
    }
    const { data, error } = await Auth.client.auth.signInWithPassword({ email: String(email).trim(), password });
    if (error) throw new Error(friendly(error));
    Auth.user = data.user;
    return data.user;
  };
  Auth.resetPassword = async (email) => {
    const { error } = await Auth.client.auth.resetPasswordForEmail(String(email).trim(), { redirectTo: location.origin + location.pathname });
    if (error) throw new Error(friendly(error));
  };
  Auth.updatePassword = async (password) => {
    if (!password || password.length < 10) throw new Error('Use uma senha com pelo menos 10 caracteres.');
    const { error } = await Auth.client.auth.updateUser({ password });
    if (error) throw new Error(friendly(error));
    Auth.recovery = false;
  };
  Auth.signOut = async () => { try { await Auth.client.auth.signOut(); } catch (e) { /* offline: limpa só localmente */ } Auth.user = null; };
  Auth.handleExpired = async () => {
    try { const { data, error } = await Auth.client.auth.refreshSession(); if (!error && data.session) return; } catch (e) { /* segue */ }
    if (CP.App && CP.App.onSignedOut) CP.App.onSignedOut('Sua sessão expirou. Entre novamente.');
  };
})();

  <script>
/*
 * Migração: dados da Fase 1 (neste navegador ou arquivo de backup) → réplica local → Supabase.
 *  • NÃO apaga nada automaticamente (o banco da Fase 1 nunca é alterado).
 *  • Ids determinísticos (UUID v5): repetir a migração NÃO cria duplicatas.
 *  • Relacionamentos (paciente → pagamento/sessão/recibo etc.) são preservados.
 */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, S = CP.storage;
  const Mig = (CP.migration = {});

  Mig.LABELS = { patients: 'Pacientes', sessions: 'Sessões', payments: 'Pagamentos', receipts: 'Recibos', expenses: 'Despesas', fixedExpenses: 'Despesas fixas',
    products: 'Produtos', sales: 'Vendas', leads: 'Leads', followups: 'Follow-ups', goals: 'Metas', achievements: 'Conquistas', events: 'Eventos da agenda' };

  Mig.detect = () => S.readLegacy();
  Mig.fromBackup = (obj) => ({ data: obj.data, settings: obj.settings || {} });
  Mig.summary = (legacy) => Object.keys(Mig.LABELS).map((k) => [Mig.LABELS[k], (legacy.data[k] || []).length]).filter((x) => x[1] > 0);
  Mig.total = (legacy) => Object.keys(Mig.LABELS).reduce((n, k) => n + (legacy.data[k] || []).length, 0);

  Mig.run = async (legacy) => {
    const uid = CP.sync.user.id;
    const cache = {};
    const nid = async (store, old) => {
      if (!old) return '';
      if (U.isUuid(old)) return old;
      const k = store + '|' + old;
      if (!cache[k]) cache[k] = await U.uuid5(`${uid}|legacy|${store}|${old}`);
      return cache[k];
    };
    const skipped = [];
    const report = { imported: {}, skipped };
    for (const store of CP.mappers.order) {
      let n = 0;
      for (const old of legacy.data[store] || []) {
        if (!old || !old.id) { skipped.push(`${Mig.LABELS[store]}: registro sem identificador`); continue; }
        const rec = { ...old, id: await nid(store, old.id) };
        if (!U.isUuid(old.id)) rec.legacyId = old.id;
        if (store === 'sessions') { delete rec.note; rec.patientId = await nid('patients', old.patientId); }
        if (store === 'payments') rec.patientId = await nid('patients', old.patientId);
        if (store === 'sales') rec.productId = await nid('products', old.productId);
        if (store === 'expenses') rec.fixedId = await nid('fixedExpenses', old.fixedId);
        if (store === 'receipts') { rec.paymentId = await nid('payments', old.paymentId); rec.patientId = await nid('patients', old.patientId); }
        if (store === 'events') rec.patientId = await nid('patients', old.patientId);
        if (store === 'followups') delete rec.patientId;
        rec.updatedAt = new Date().toISOString();
        await CP.db.putLocal(store, rec);
        await CP.sync.queueUpsert(store, rec.id);
        n++;
      }
      report.imported[store] = n;
    }
    // configurações: só preenche o que ainda está vazio na nuvem/aparelho
    const ls = legacy.settings || {}, cur = CP.settings.data, patch = {};

    if (ls.monthlyGoal && !cur.monthlyGoal) patch.monthlyGoal = ls.monthlyGoal;

  <script>
/*
 * Regras financeiras (todas reais, nada inventado):
 *  - Receita recebida  = SOMENTE pagamentos com status "pago" (+ vendas pagas).
 *  - Receita prevista  = valores esperados das pacientes/pacotes no mês (+ produtos já lançados).
 *  - A receber         = prevista − recebida (nunca negativo).
 *  - Lucro             = recebida − despesas com status "pago".
 */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U;
  const F = (CP.finance = {});

  /* Valor esperado de uma paciente no mês */
  F.expectedForPatient = (p, m) => {
    const live = ['ativa', 'nova'].includes(p.status) || (p.exitDate && U.monthKey(p.exitDate) >= m);
    if (!live) return 0;
    let exp = 0;
    const started = !p.startDate || U.monthKey(p.startDate) <= m;
    const exited = p.exitDate && U.monthKey(p.exitDate) < m;
    if (started && !exited) {
      if (p.paymentModel === 'pacote_mensal') exp += (Number(p.packageSize) || 0) * (Number(p.sessionValue) || 0);
      else {
        // semanal/quinzenal/por sessão: só conta sessões já agendadas/realizadas na agenda
        const n = CP.sessions.all().filter((s) => s.patientId === p.id && U.monthKey(s.date) === m && ['agendada', 'realizada'].includes(s.status)).length;
        exp += n * (Number(p.sessionValue) || 0);
      }
    }
    if (p.evaluationDate && U.monthKey(p.evaluationDate) === m) exp += Number(p.evaluationValue) || 0;
    return exp;
  };

  F.monthSummary = (m) => {
    const pays = CP.payments.all().filter((x) => U.monthKey(x.date) === m);
    const paid = pays.filter((x) => x.status === 'pago');
    const pend = pays.filter((x) => x.status === 'pendente' || x.status === 'parcial');
    const sales = CP.sales.all().filter((x) => U.monthKey(x.date) === m);
    const salesPaid = sales.filter((x) => x.status === 'pago');
    const salesPend = sales.filter((x) => x.status === 'pendente');
    const patPaid = paid.filter((x) => x.refType !== 'produto');
    const prodPaidPay = paid.filter((x) => x.refType === 'produto');
    const patientRevenue = U.sum(patPaid, (x) => x.value);
    const productRevenue = U.sum(salesPaid, (x) => x.value) + U.sum(prodPaidPay, (x) => x.value);
    const received = patientRevenue + productRevenue;

    // Previsto por paciente
    const perPatient = [];
    let expectedPatients = 0;
    CP.patients.all().forEach((p) => {
      const paidP = U.sum(patPaid.filter((x) => x.patientId === p.id), (x) => x.value);
      const pendP = U.sum(pend.filter((x) => x.patientId === p.id && x.refType !== 'produto'), (x) => x.value);
      const exp = Math.max(F.expectedForPatient(p, m), paidP + pendP);
      if (exp > 0 || paidP > 0) perPatient.push({ id: p.id, name: p.name, expected: exp, paid: paidP, pending: Math.max(0, exp - paidP) });
      expectedPatients += exp;
    });
    const knownIds = new Set(CP.patients.all().map((p) => p.id));
    const orphanPaid = U.sum(patPaid.filter((x) => !knownIds.has(x.patientId)), (x) => x.value);
    const orphanPend = U.sum(pend.filter((x) => !knownIds.has(x.patientId) && x.refType !== 'produto'), (x) => x.value);
    if (orphanPaid + orphanPend > 0) { perPatient.push({ id: '', name: 'Sem paciente cadastrada', expected: orphanPaid + orphanPend, paid: orphanPaid, pending: orphanPend }); expectedPatients += orphanPaid + orphanPend; }

    const productPending = U.sum(salesPend, (x) => x.value) + U.sum(pend.filter((x) => x.refType === 'produto'), (x) => x.value);
    const expected = expectedPatients + productRevenue + productPending;
    const toReceive = Math.max(0, expected - received);

    const exps = CP.expenses.all().filter((x) => U.monthKey(x.date) === m);
    const expensesPaid = U.sum(exps.filter((x) => x.status === 'pago'), (x) => x.value);
    const expensesPending = U.sum(exps.filter((x) => x.status === 'pendente'), (x) => x.value);

    const done = CP.sessions.all().filter((s) => s.status === 'realizada' && U.monthKey(s.date) === m);
    const served = new Set([...done.map((s) => s.patientId), ...patPaid.map((x) => x.patientId)].filter(Boolean));
    const payers = new Set(patPaid.map((x) => x.patientId).filter(Boolean));
    const payerRevenue = U.sum(patPaid.filter((x) => x.patientId), (x) => x.value);

    // Receita por produto
    const byProduct = {};
    salesPaid.forEach((s) => { const k = s.productId || '_'; byProduct[k] = byProduct[k] || { name: (CP.products.get(s.productId) || {}).name || 'Produto removido', qty: 0, revenue: 0 }; byProduct[k].qty++; byProduct[k].revenue += Number(s.value) || 0; });
    if (prodPaidPay.length) byProduct._pay = { name: 'Pagamentos “referente a produto”', qty: prodPaidPay.length, revenue: U.sum(prodPaidPay, (x) => x.value) };

    // Despesas por categoria
    const byCategory = {};
    exps.filter((x) => x.status === 'pago').forEach((x) => { byCategory[x.category || 'outros'] = (byCategory[x.category || 'outros'] || 0) + (Number(x.value) || 0); });

    return {
      month: m, received, patientRevenue, productRevenue, expected, toReceive,
      expensesPaid, expensesPending, profit: received - expensesPaid,
      sessionsDone: done.length, servedCount: served.size,
      ticket: payers.size ? payerRevenue / payers.size : null,
      perPatient: U.sortBy(perPatient, (x) => x.paid, -1),
      byProduct: Object.values(byProduct), byCategory,
      pendingPayments: pend, receiptsPending: paid.filter((x) => !x.receiptIssued), carnePending: paid.filter((x) => !x.carneLeao),
      newPatients: CP.patients.all().filter((p) => U.monthKey(p.startDate) === m).length,
      exits: CP.patients.all().filter((p) => U.monthKey(p.exitDate) === m).length,
      newLeads: CP.leads.all().filter((l) => (l.firstContact ? U.monthKey(l.firstContact) : U.monthKey(l.createdAt)) === m).length,
      hasData: received > 0 || expensesPaid > 0 || done.length > 0 || expected > 0,
    };
  };

  F.yearSummary = (year) => {
    const months = [];
    for (let i = 1; i <= 12; i++) months.push(F.monthSummary(`${year}-${U.pad(i)}`));
    const revenue = U.sum(months, (x) => x.received);
    const expenses = U.sum(months, (x) => x.expensesPaid);
    const active = months.filter((x) => x.received > 0 || x.expensesPaid > 0);
    const withRev = months.filter((x) => x.received > 0);
    const best = withRev.length ? withRev.reduce((a, b) => (b.received > a.received ? b : a)) : null;
    const worst = withRev.length > 1 ? withRev.reduce((a, b) => (b.received < a.received ? b : a)) : null;
    const served = new Set();
    CP.sessions.all().filter((s) => s.status === 'realizada' && U.yearOf(s.date) === year).forEach((s) => s.patientId && served.add(s.patientId));
    CP.payments.all().filter((p) => p.status === 'pago' && p.refType !== 'produto' && U.yearOf(p.date) === year).forEach((p) => p.patientId && served.add(p.patientId));
    const salesPaid = CP.sales.all().filter((s) => s.status === 'pago' && U.yearOf(s.date) === year);
    return {
      year, months, revenue, expenses, profit: revenue - expenses,
      avg: active.length ? revenue / active.length : null, activeMonths: active.length, best, worst,
      served: served.size,
      sessions: U.sum(months, (x) => x.sessionsDone),
      evaluations: CP.patients.all().filter((p) => U.yearOf(p.evaluationDate) === year).length,
      salesCount: salesPaid.length, salesRevenue: U.sum(salesPaid, (s) => s.value),
    };
  };
})();

/* Backup em JSON: exportar, validar, importar e limpar */
(function () {
  'use strict';
  const CP = window.CP;
  const B = (CP.backup = {});
  B.APP = 'consultorio-psi';
  B.VERSION = 2;

  B.export = async () => ({
    app: B.APP, version: 2, exportedAt: new Date().toISOString(),
    settings: CP.settings.data, data: await CP.storage.exportAll(),
  });

  B.validate = (obj) => {
    const errors = [];
    const counts = {};
    let total = 0;
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok: false, errors: ['O arquivo não tem o formato esperado.'], counts, total };
    if (obj.app !== B.APP) errors.push('Este arquivo não parece ser um backup deste sistema.');
    if (!obj.data || typeof obj.data !== 'object') errors.push('O backup não contém a seção de dados.');
    else {
      CP.storage.STORES.forEach((s) => {
        const arr = obj.data[s];
        if (arr === undefined) return;
        if (!Array.isArray(arr)) { errors.push(`A seção "${s}" deveria ser uma lista.`); return; }
        arr.forEach((r, i) => { if (!r || typeof r !== 'object' || typeof r.id !== 'string' || !r.id) errors.push(`Registro ${i + 1} de "${s}" sem identificador válido.`); });
        counts[s] = arr.length; total += arr.length;
      });
    }
    if (obj.settings !== undefined && (typeof obj.settings !== 'object' || obj.settings === null)) errors.push('As configurações do backup são inválidas.');
    return { ok: errors.length === 0, errors: errors.slice(0, 6), counts, total };
  };

  // Fase 2: importar = migração (adiciona/atualiza na nuvem, nunca apaga). Ver migration.js
})();

    const bodyEl = wrap.querySelector('.modal-body');
    if (typeof body === 'string') bodyEl.innerHTML = body; else if (body) bodyEl.appendChild(body);
    let closed = false;
    const api = {
      el: wrap, body: bodyEl, foot: wrap.querySelector('.modal-foot'),
      close() {

        const saved = await P.save(rec);

        if (p && p.name !== saved.name) {
          for (const x of CP.payments.forPatient(p.id)) await CP.payments.save({ ...x, patientName: saved.name });
          for (const x of CP.sessions.forPatient(p.id)) await CP.sessions.save({ ...x, patientName: saved.name });

          if (d != null && (v.value == null || v.value === auto)) { set('value', d); auto = d; }
        }
      },
      extraButtons: p ? [{ label: 'Excluir', cls: 'danger', onClick: async (m) => { m.close(); A.deletePayment(p.id); } }] : [],
      onSubmit: async (v) => {
        const pat = v.patientId ? CP.patients.get(v.patientId) : null;
        const rec = {
          ...(p || {}), ...v, value: Number(v.value) || 0,
          patientName: pat ? pat.name : (p && p.patientId === v.patientId ? p.patientName : ''),
          refMonth: v.refType === 'pacote' ? v.refMonth || U.monthKey(v.date) : '',
          receiptDate: v.receiptIssued ? v.receiptDate || U.today() : '',
          carneDate: v.carneLeao ? v.carneDate || U.today() : '',
        };
        if (!(rec.value > 0)) throw new Error('Informe um valor maior que zero.');
        await Pay.save(rec);
        UI.toast(p ? 'Pagamento atualizado.' : 'Pagamento registrado com sucesso.');
        CP.App.refresh();
      },
    });

  A.newPayment = (prefill) => paymentForm(null, prefill || {});
  A.editPayment = (id) => { const p = Pay.get(id); if (p) paymentForm(p); };
  A.deletePayment = async (id) => {
    const cur = Pay.get(id);
    if (cur && (cur.receiptIssued || CP.receipts.all().some((r) => r.paymentId === id))) {
      const est = await UI.confirm({ title: 'Pagamento com recibo emitido', message: 'Este pagamento tem recibo emitido e <strong>não pode ser excluído</strong> (para não quebrar a numeração). Deseja marcá-lo como <strong>estornado</strong>?', confirmText: 'Marcar como estornado' });
      if (!est) return;
      await Pay.save({ ...cur, status: 'estornado' }); UI.toast('Pagamento marcado como estornado.'); CP.App.refresh(); return;
    }
    const ok = await UI.confirm({ title: 'Excluir pagamento', message: 'Excluir este pagamento do histórico? Esta ação não pode ser desfeita.', confirmText: 'Excluir', danger: true });

    await Pay.remove(id); UI.toast('Pagamento excluído.'); CP.App.refresh();

  /* ---------- Tabela reutilizável ---------- */
  CP.payUI = {
    table(rows, opts = {}) {
      const cols = [
        { label: 'Data', render: (p) => U.fmtDate(p.date) },
        ...(opts.hidePatient ? [] : [{ label: 'Paciente', render: (p) => `<strong>${esc(nm(p.patientId, p.patientName))}</strong>` }]),
        { label: 'Referente', render: (p) => esc(UI.labelOf(Pay.REF, p.refType)) + (p.refType === 'pacote' && p.refMonth ? `<br><small>${esc(U.monthLabel(p.refMonth))}</small>` : '') },
        { label: 'Forma', render: (p) => esc(UI.labelOf(Pay.METHODS, p.method)) },
        { label: 'Valor', cls: 'num', render: (p) => `<strong>${U.money(p.value)}</strong>` },
        { label: 'Status', render: (p) => UI.sb(p.status, UI.labelOf(Pay.STATUS, p.status)) },
        { label: 'Recibo', render: (p) => UI.sb(p.receiptIssued ? 'sim' : 'nao', p.receiptIssued ? 'Sim' : 'Não') },
        { label: 'Carnê-Leão', render: (p) => UI.sb(p.carneLeao ? 'sim' : 'nao', p.carneLeao ? 'Sim' : 'Não') },
        { label: '', cls: 'act', render: (p) => UI.actions([
          ...(p.status === 'pago' ? [{ act: 'pay-receipt', id: p.id, icon: 'receipt', label: 'Gerar recibo' }] : []),
          { act: 'pay-edit', id: p.id, icon: 'edit', label: 'Editar' },
          { act: 'pay-del', id: p.id, icon: 'trash', label: 'Excluir', danger: true },
        ]) },
      ];
      return UI.table(cols, rows);
    },
    bind(root) {
      UI.delegate(root, (act, id) => {
        if (act === 'pay-edit') A.editPayment(id);
        else if (act === 'pay-del') A.deletePayment(id);
        else if (act === 'pay-receipt') A.issueReceipt(id);
      });
    },
  };

  /* ---------- Tela ---------- */
  const f = { month: U.thisMonth(), year: '', patient: '', status: '', method: '', receipt: '', carne: '' };
  const yn = [['', 'Todos'], ['sim', 'Sim'], ['nao', 'Não']];

  function filtered() {
    return U.sortBy(Pay.all().filter((p) => {
      if (f.month && U.monthKey(p.date) !== f.month) return false;
      if (!f.month && f.year && U.yearOf(p.date) !== f.year) return false;
      if (f.patient && p.patientId !== f.patient) return false;
      if (f.status && p.status !== f.status) return false;
      if (f.method && p.method !== f.method) return false;
      if (f.receipt && (f.receipt === 'sim') !== !!p.receiptIssued) return false;
      if (f.carne && (f.carne === 'sim') !== !!p.carneLeao) return false;
      return true;
    }), (p) => p.date + (p.createdAt || ''), -1);
  }

  CP.views.pagamentos = {
    render(root) {
      const weekly = CP.patients.all().filter((p) => ['semanal', 'quinzenal', 'por_sessao'].includes(p.paymentModel) && ['ativa', 'nova'].includes(p.status));
      const refMonth = f.month || U.thisMonth();
      const refYear = f.month ? f.month.slice(0, 4) : f.year || U.today().slice(0, 4);
      root.innerHTML = UI.pageHead('Pagamentos', 'Histórico completo de pagamentos recebidos e pendentes.', `<button class="btn primary" id="newPay">${UI.icon('plus', 18)} Registrar pagamento</button>`) +
        (weekly.length ? `<section class="card"><h3>Pagamentos semanais</h3><p class="sub" style="margin-top:-8px">Referência: ${esc(U.monthLabel(refMonth))} e ano ${refYear}.</p><div class="grid g-3">${weekly.map((p) => {
          const t = Pay.totals(p.id, refMonth, refYear);
          return `<div class="stat"><span class="stat-l">${esc(p.name)}${p.sessionValue ? ` · padrão ${U.money(p.sessionValue)}` : ''}</span><strong class="stat-v">${U.money(t.month)}</strong><span class="stat-s">no mês · ${t.countMonth} pagamento(s)</span><span class="stat-s">${U.money(t.year)} no ano · ${t.count} no total · ${t.pendingCount} pendente(s)</span></div>`;
        }).join('')}</div></section>` : '') +
        `<section class="card section">${UI.filters([
          { key: 'month', label: 'Mês', type: 'month' },
          { key: 'year', label: 'Ano', options: UI.opts.list(UI.opts.years().map((y) => [y, y]), 'Todos') },
          { key: 'patient', label: 'Paciente', options: UI.opts.patients('Todas') },
          { key: 'status', label: 'Status', options: UI.opts.list(Pay.STATUS, 'Todos') },
          { key: 'method', label: 'Forma de pagamento', options: UI.opts.list(Pay.METHODS, 'Todas') },
          { key: 'receipt', label: 'Recibo emitido', options: yn },
          { key: 'carne', label: 'Carnê-Leão', options: yn },
        ], f)}<div id="list"></div></section>`;
      const draw = () => {
        const rows = filtered();
        const paid = U.sum(rows.filter((p) => p.status === 'pago'), (p) => p.value);
        const pend = U.sum(rows.filter((p) => p.status === 'pendente' || p.status === 'parcial'), (p) => p.value);
        root.querySelector('#list').innerHTML = rows.length
          ? `<div class="sum-strip"><span>Recebido: <b>${U.money(paid)}</b></span><span>Pendente/parcial: <b>${U.money(pend)}</b></span><span>${rows.length} registro(s)</span></div>${CP.payUI.table(rows)}`
          : UI.empty({ icon: 'wallet', title: 'Nenhum pagamento encontrado', text: 'Ajuste os filtros ou registre um novo pagamento.', action: '<button class="btn soft" data-act="new">+ Registrar pagamento</button>' });
      };
      draw();
      UI.bindFilters(root, f, draw);
      root.querySelector('#newPay').onclick = () => A.newPayment();
      CP.payUI.bind(root);
      root.querySelector('#list').addEventListener('click', (e) => { if (e.target.closest('[data-act="new"]')) A.newPayment(); });
    },
  };
})();

      onSubmit: async (v) => {

        const slot = v.slot ? Number(v.slot) : '';
        const month = slot ? v.month || U.monthKey(v.date) : '';
        if (slot && S.all().some((x) => x.id !== (s && s.id) && x.patientId === v.patientId && Number(x.slot) === slot && (x.month || U.monthKey(x.date)) === month)) {

        CP.App.refresh();
      },
    });
  }
  A.newSession = (prefill) => sessionForm(null, prefill || {});
  A.editSession = (id) => { const s = S.get(id); if (s) sessionForm(s); };
  A.deleteSession = async (id) => {
    const ok = await UI.confirm({ title: 'Excluir sessão', message: 'Excluir esta sessão do registro?', confirmText: 'Excluir', danger: true });

        { label: '', cls: 'act', render: (s) => UI.actions([{ act: 'ses-edit', id: s.id, icon: 'edit', label: 'Editar' }, { act: 'ses-del', id: s.id, icon: 'trash', label: 'Excluir', danger: true }]) },
      ], rows);

      const self = CP.pkgUI;

        if (!p) { el.innerHTML = ''; return; }
        const pk = S.pkg(patientId, self.month);
        el.innerHTML = `<div class="pkg-top"><div><h3 style="margin:0">Pacote mensal — ${esc(p.name)}</h3><p style="margin:4px 0 0"><strong>${pk.done} de ${pk.size} sessões realizadas</strong> · Pagamento: ${UI.sb(pk.paid ? 'pago' : 'pendente', pk.paid ? 'Pago' : 'Pendente')}</p></div>
          <div class="head-actions">${UI.monthNav(self.month)}${pk.paid ? '' : `<button class="btn soft sm" data-pk="pay">Registrar pagamento do pacote</button>`}</div></div>

          <div class="slots">${pk.slots.map(({ n, session: s }) => `<button class="slot ${s && s.status === 'realizada' ? 'done' : ''}" data-pk="slot" data-n="${n}"><h5>Sessão ${n}${s ? UI.sb(s.status, UI.labelOf(S.STATUS, s.status)) : ''}</h5>${s ? `<p>${U.fmtDate(s.date)}${s.time ? ' · ' + esc(s.time) : ''}</p>` : '<p>Sem data — toque para agendar</p>'}</button>`).join('')}</div>`;

      draw();

        const b = e.target.closest('[data-pk]'); if (!b) return;
        const p = CP.patients.get(patientId);
        if (b.dataset.pk === 'pay') {
          A.newPayment({ patientId, refType: 'pacote', refMonth: self.month, date: U.today(), status: 'pago', method: p && p.paymentMethod ? p.paymentMethod : 'pix' });
        } else {
          const n = Number(b.dataset.n);
          const s = S.pkg(patientId, self.month).slots.find((x) => x.n === n).session;
          if (s) A.editSession(s.id);
          else A.newSession({ patientId, slot: n, month: self.month, date: self.month === U.thisMonth() ? U.today() : self.month + '-01', time: p && p.sessionTime ? p.sessionTime : '' });
        }
      };
    },
  };
})();

  <script>
/* Agenda: calendário mensal + pacotes mensais */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, UI = CP.UI, esc = U.esc, A = CP.actions, E = CP.events;
  let tab = 'cal', month = U.thisMonth(), sel = U.today(), pkgPatient = '';

  /* ---------- Eventos ---------- */
  function eventForm(ev, date) {
    const vals = ev ? { ...ev } : { type: 'sessao', date: date || U.today() };
    UI.form({
      title: ev ? 'Editar evento' : 'Adicionar evento', values: vals, submitText: ev ? 'Salvar alterações' : 'Adicionar',
      fields: [
        { key: 'type', label: 'Tipo', type: 'select', options: ev ? E.TYPES.filter((t) => t[0] !== 'sessao') : E.TYPES, hint: ev ? '' : 'Eventos do tipo “Sessão” entram no controle de sessões da paciente.' },
        { key: 'date', label: 'Data', type: 'date', required: true },
        { key: 'time', label: 'Horário', type: 'time' },
        { key: 'patientId', label: 'Paciente', type: 'select', options: UI.opts.patients('— nenhuma —') },
        { key: 'title', label: 'Título', type: 'text', placeholder: 'Opcional', full: true },
        { key: 'note', label: 'Observação administrativa', type: 'textarea', maxlength: 500 },
      ],
      extraButtons: ev ? [{ label: 'Excluir', cls: 'danger', onClick: async (m) => { const ok = await UI.confirm({ title: 'Excluir evento', message: 'Excluir este evento da agenda?', confirmText: 'Excluir', danger: true }); if (!ok) return; await E.remove(ev.id); m.close(); UI.toast('Evento excluído.'); CP.App.refresh(); } }] : [],
      onSubmit: async (v) => {
        if (!ev && v.type === 'sessao') {
          if (!v.patientId) throw new Error('Selecione a paciente para registrar uma sessão.');
          const pat = CP.patients.get(v.patientId);
          await CP.sessions.save({ patientId: v.patientId, patientName: pat ? pat.name : '', date: v.date, time: v.time, status: 'agendada', slot: '', month: '' });
          UI.toast('Sessão agendada.');
        } else {
          await E.save({ ...(ev || {}), ...v });
          UI.toast(ev ? 'Evento atualizado.' : 'Evento adicionado.');
        }
        CP.App.refresh();
      },
    });
  }
  A.newEvent = (date) => eventForm(null, date);
  A.editEvent = (id) => { const e = E.get(id); if (e) eventForm(e); };

  function openItem(it) {
    switch (it.src) {
      case 'session': return A.editSession(it.id);
      case 'event': return A.editEvent(it.id);
      case 'payment': return A.editPayment(it.id);
      case 'patient': return CP.App.go('pacientes', it.id);
      case 'expense': return A.editExpense(it.id);
      case 'followup': return A.editFollowup(it.id);
      case 'lead': return A.editLead(it.id);
      default: return null;
    }
  }

  /* ---------- Calendário ---------- */
  function calendar(box) {
    if (U.monthKey(sel) !== month) sel = U.monthKey(U.today()) === month ? U.today() : month + '-01';
    const lead = new Date(+month.slice(0, 4), +month.slice(5, 7) - 1, 1).getDay();
    const map = CP.agenda.monthMap(month);
    const today = U.today();
    let cells = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map((d) => `<div class="wd">${d}</div>`).join('');
    for (let i = 0; i < lead; i++) cells += '<div class="day empty"></div>';
    Object.keys(map).forEach((date) => {
      const items = map[date];
      cells += `<button class="day ${date === today ? 'today' : ''} ${date === sel ? 'sel' : ''}" data-date="${date}" aria-label="${U.fmtDate(date)}, ${items.length} item(ns)"><span class="n">${+date.slice(8)}</span>
        <span class="chips">${items.slice(0, 2).map((it) => `<span class="chip" style="--c:${CP.agenda.COLORS[it.type]}">${esc(it.title)}</span>`).join('')}${items.length > 2 ? `<em>+${items.length - 2}</em>` : ''}</span>
        <span class="dots">${items.slice(0, 4).map((it) => `<i class="dot" style="--c:${CP.agenda.COLORS[it.type]}"></i>`).join('')}</span></button>`;
    });
    const items = map[sel] || [];
    box.innerHTML = `<div class="head-actions" style="justify-content:space-between;margin-bottom:14px">${UI.monthNav(month)}<button class="btn soft sm" data-today>Hoje</button></div>
      <div class="cal">${cells}</div>
      <div class="legend">${E.TYPES.map(([k, l]) => `<span><i class="dot" style="--c:${CP.agenda.COLORS[k]}"></i>${l}</span>`).join('')}</div>
      <section class="card section"><div class="card-head"><h3>${U.fmtDate(sel)}</h3><button class="btn primary sm" data-add>${UI.icon('plus', 16)} Adicionar evento</button></div>
      ${items.length ? items.map((it, i) => `<button class="agenda-item ${it.status === 'cancelada' ? 'cancelled' : ''}" data-i="${i}"><i class="dot" style="--c:${CP.agenda.COLORS[it.type]}"></i><div><strong>${esc(it.title)}</strong><small>${esc(UI.labelOf(E.TYPES, it.type))}${it.time ? ' · ' + esc(it.time) : ''}${it.status ? ' · ' + esc(UI.labelOf(CP.sessions.STATUS, it.status)) : ''}</small></div></button>`).join('')
        : UI.empty({ icon: 'calendar', title: 'Nada neste dia', text: 'Use “Adicionar evento” para agendar uma sessão, avaliação ou lembrete.' })}</section>`;
    box.onclick = (e) => {
      const nav = e.target.closest('[data-nav]'); if (nav) { month = U.addMonths(month, Number(nav.dataset.nav)); return calendar(box); }
      if (e.target.closest('[data-today]')) { month = U.thisMonth(); sel = U.today(); return calendar(box); }
      const d = e.target.closest('[data-date]'); if (d) { sel = d.dataset.date; return calendar(box); }
      if (e.target.closest('[data-add]')) return A.newEvent(sel);
      const it = e.target.closest('[data-i]'); if (it) openItem(items[Number(it.dataset.i)]);
    };
  }

  /* ---------- Pacotes mensais ---------- */
  function packages(box) {
    const pk = U.sortBy(CP.patients.all().filter((p) => p.paymentModel === 'pacote_mensal'), (p) => U.norm(p.name));
    if (!pk.length) { box.innerHTML = UI.empty({ icon: 'calendar', title: 'Nenhuma paciente com pacote mensal', text: 'Defina a modalidade “Pacote mensal” no cadastro da paciente.' }); return; }
    if (!pk.some((p) => p.id === pkgPatient)) pkgPatient = pk[0].id;
    const m = CP.pkgUI.month;
    box.innerHTML = `<div class="filters"><label class="f"><span>Paciente</span><select id="pkSel">${pk.map((p) => `<option value="${p.id}" ${p.id === pkgPatient ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label></div>
      <section class="card" id="pkgBox"></section>
      <section class="card section"><h3>Visão geral — ${esc(U.monthLabel(m))}</h3>${UI.table([
        { label: 'Paciente', render: (p) => `<strong>${esc(p.name)}</strong>` },
        { label: 'Sessões', render: (p) => { const k = CP.sessions.pkg(p.id, m); return `${k.done} de ${k.size} realizadas`; } },
        { label: 'Pagamento', render: (p) => { const ok = CP.sessions.pkg(p.id, m).paid; return UI.sb(ok ? 'pago' : 'pendente', ok ? 'Pago' : 'Pendente'); } },
      ], pk)}</section>`;
    CP.pkgUI.mount(box.querySelector('#pkgBox'), pkgPatient);
    box.querySelector('#pkSel').onchange = (e) => { pkgPatient = e.target.value; packages(box); };
    // ao trocar o mês dentro do painel, atualiza também a visão geral
    box.querySelector('#pkgBox').addEventListener('click', (e) => { if (e.target.closest('[data-nav]')) setTimeout(() => packages(box), 0); });
  }

  CP.views.agenda = {
    render(root) {
      root.innerHTML = UI.pageHead('Agenda', 'Sessões, pagamentos, avaliações, vencimentos e follow-ups.', `<button class="btn primary" id="addEv">${UI.icon('plus', 18)} Adicionar evento</button>`) +
        UI.tabs([['cal', 'Calendário'], ['pkg', 'Pacotes mensais']], tab) + '<div id="box"></div>';
      const box = root.querySelector('#box');
      if (tab === 'cal') calendar(box); else packages(box);
      UI.bindTabs(root, (t) => { tab = t; CP.views.agenda.render(root); });
      root.querySelector('#addEv').onclick = () => A.newEvent(tab === 'cal' ? sel : U.today());
    },
  };
})();

</script>

(function () {

  const nm = CP.patients.name;
